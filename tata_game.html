// Cartello Direzionale in Legno con larghezza auto-adattiva (nessuna scritta sborda MAI)
function drawSignpost(x, y, text) {
  ctx.save();
  ctx.font = "bold 11.5px 'Comic Sans MS', sans-serif";
  const metrics = ctx.measureText(text);
  const textWidth = metrics.width;
  const boardW = Math.max(135, Math.ceil(textWidth + 28));
  const boardH = 27;
  const boardX = x - boardW / 2;
  const boardY = y - 62;

  // Palo in legno scuro con sfumatura
  ctx.fillStyle = "#5D4037";
  ctx.fillRect(x - 4, y - 46, 8, 46);
  ctx.fillStyle = "#3E2723";
  ctx.fillRect(x + 1, y - 46, 3, 46);

  // Ombra della tabella
  ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(boardX + 2, boardY + 3, boardW, boardH, 6) : ctx.rect(boardX + 2, boardY + 3, boardW, boardH);
  ctx.fill();

  // Tabella sagomata in legno chiaro con gradiente
  const woodGrad = ctx.createLinearGradient(boardX, boardY, boardX, boardY + boardH);
  woodGrad.addColorStop(0, "#FFF9E6");
  woodGrad.addColorStop(0.5, "#EFEBE9");
  woodGrad.addColorStop(1, "#D7CCC8");
  ctx.fillStyle = woodGrad;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(boardX, boardY, boardW, boardH, 6) : ctx.rect(boardX, boardY, boardW, boardH);
  ctx.fill();

  // Bordo intagliato in legno scuro
  ctx.strokeStyle = "#5D4037";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Chiodini dorati alle estremità
  ctx.fillStyle = "#3E2723";
  ctx.beginPath();
  ctx.arc(boardX + 8, boardY + boardH / 2, 2.2, 0, Math.PI * 2);
  ctx.arc(boardX + boardW - 8, boardY + boardH / 2, 2.2, 0, Math.PI * 2);
  ctx.fill();

  // Testo perfettamente centrato
  ctx.fillStyle = "#3E2723";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, boardY + boardH / 2 + 1);
  ctx.restore();
}

// Rifugio Montano Finale di Tatà (Traguardo)
function drawFinishHouse(x, y) {
  // Chalet di legno
  ctx.fillStyle = "#795548";
  ctx.fillRect(x, y - 85, 115, 85);

  // Travi in legno
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y - 85, 115, 85);

  // Tetto con manto di neve soffice
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.moveTo(x - 12, y - 85);
  ctx.lineTo(x + 57.5, y - 130);
  ctx.lineTo(x + 127, y - 85);
  ctx.closePath();
  ctx.fill();

  // Neve candida sopra il tetto
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.moveTo(x - 16, y - 85);
  ctx.lineTo(x + 57.5, y - 136);
  ctx.lineTo(x + 131, y - 85);
  ctx.quadraticCurveTo(x + 100, y - 78, x + 57.5, y - 120);
  ctx.quadraticCurveTo(x + 15, y - 78, x - 16, y - 85);
  ctx.closePath();
  ctx.fill();

  // Porta del rifugio
  ctx.fillStyle = "#F8A4B8"; // Porta rosa soffice abbinata a Tatà!
  ctx.fillRect(x + 42, y - 55, 30, 55);
  ctx.strokeStyle = "#D4708A";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 42, y - 55, 30, 55);
  // Cuoricino sulla porta
  ctx.fillStyle = "#E75480";
  ctx.beginPath();
  ctx.arc(x + 54, y - 30, 3, 0, Math.PI * 2);
  ctx.arc(x + 60, y - 30, 3, 0, Math.PI * 2);
  ctx.lineTo(x + 57, y - 24);
  ctx.closePath();
  ctx.fill();

  // Finestra accogliente illuminata di giallo caldo
  ctx.fillStyle = "#FFF59D";
  ctx.fillRect(x + 10, y - 62, 22, 22);
  ctx.strokeStyle = "#3E2723";
  ctx.lineWidth = 1.8;
  ctx.strokeRect(x + 10, y - 62, 22, 22);

  // Ghirlanda con bandierine festive colorate
  const flagColors = ["#F44336", "#FFEB3B", "#4CAF50", "#2196F3", "#E91E63", "#FF9800"];
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x - 30, y - 110);
  ctx.quadraticCurveTo(x + 57.5, y - 90, x + 150, y - 110);
  ctx.stroke();

  for (let i = 0; i < 7; i++) {
    const fx = x - 20 + i * 23;
    const fy = y - 100 + Math.sin(i * 0.5) * 4;
    ctx.fillStyle = flagColors[i % flagColors.length];
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + 12, fy);
    ctx.lineTo(fx + 6, fy + 12);
    ctx.closePath();
    ctx.fill();
  }

  // Cartello traguardo
  ctx.fillStyle = "#FFF";
  ctx.strokeStyle = "#E91E63";
  ctx.lineWidth = 2;
  ctx.fillRect(x - 10, y - 165, 135, 26);
  ctx.strokeRect(x - 10, y - 165, 135, 26);

  ctx.fillStyle = "#C2185B";
  ctx.font = "bold 13px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🏠 CASA DI TATÀ!", x + 57.5, y - 148);
}

// L'Amico Totò (coniglietto dudù grigio e azzurro che aspetta Tatà felice)
function drawToto(x, y) {
  ctx.save();
  // Saltellino amichevole
  const hop = Math.sin(Date.now() * 0.005) * 3;
  ctx.translate(x + toto.w / 2, y + toto.h / 2 + hop);

  // Palette Dudù Totò
  const plushGrey = "#B0BEC5";
  const plushLightGrey = "#ECEFF1";
  const plushBlue = "#4FC3F7";
  const plushLightBlue = "#E1F5FE";
  const stitchBlue = "#0288D1";
  const threadDark = "#263238";

  // 1. Orecchie morbide grigie con interno azzurro
  ctx.fillStyle = plushGrey;
  ctx.beginPath();
  ctx.ellipse(-7, -23, 6, 16, -0.12, 0, Math.PI * 2);
  ctx.ellipse(5, -24, 6, 16, 0.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = plushLightBlue;
  ctx.beginPath();
  ctx.ellipse(-7, -23, 3, 11, -0.12, 0, Math.PI * 2);
  ctx.ellipse(5, -24, 3, 11, 0.15, 0, Math.PI * 2);
  ctx.fill();

  // Cuciture a vista sull'orecchio
  ctx.save();
  ctx.strokeStyle = stitchBlue;
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 2]);
  ctx.beginPath();
  ctx.ellipse(5, -24, 5.5, 14, 0.15, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 2. Corpicino a copertina dudù azzurra
  ctx.fillStyle = plushBlue;
  ctx.beginPath();
  ctx.moveTo(-5, 6);
  ctx.quadraticCurveTo(-14, 12, -15, 20);
  ctx.quadraticCurveTo(-5, 17, 0, 20);
  ctx.quadraticCurveTo(8, 17, 14, 20);
  ctx.quadraticCurveTo(11, 10, 5, 6);
  ctx.closePath();
  ctx.fill();

  // Nodini agli angoli
  ctx.fillStyle = plushLightBlue;
  ctx.beginPath();
  ctx.arc(-15, 20, 3, 0, Math.PI * 2);
  ctx.arc(14, 20, 3, 0, Math.PI * 2);
  ctx.fill();

  // Cuciture sul bordo copertina
  ctx.save();
  ctx.strokeStyle = stitchBlue;
  ctx.lineWidth = 1.2;
  ctx.setLineDash([2.5, 2]);
  ctx.beginPath();
  ctx.moveTo(-13, 18);
  ctx.quadraticCurveTo(-4, 15, 0, 18);
  ctx.quadraticCurveTo(6, 15, 12, 18);
  ctx.stroke();
  ctx.restore();

  // Cuoricino sul pancino
  ctx.fillStyle = plushLightBlue;
  ctx.beginPath();
  ctx.arc(0, 13, 3, 0, Math.PI * 2);
  ctx.fill();

  // 3. Codina soffice bianca
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(13, 12, 5, 0, Math.PI * 2);
  ctx.fill();

  // 4. Testolina rotonda grigia
  ctx.fillStyle = plushGrey;
  ctx.beginPath();
  ctx.arc(0, -2, 14, 0, Math.PI * 2);
  ctx.fill();

  // Guancia morbida azzurrina
  ctx.fillStyle = "#81D4FA";
  ctx.beginPath();
  ctx.arc(-4, 3, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Occhietto ricamato (rivolto a sinistra verso Tatà)
  ctx.fillStyle = threadDark;
  ctx.beginPath();
  ctx.arc(-5, -4, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(-6, -5, 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Nasino ricamato azzurro
  ctx.fillStyle = "#0288D1";
  ctx.beginPath();
  ctx.moveTo(-11, -3);
  ctx.lineTo(-13.5, -5);
  ctx.lineTo(-13.5, -1);
  ctx.closePath();
  ctx.fill();

  // Boccuccia sorridente
  ctx.strokeStyle = threadDark;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(-9, 0, 2.5, 0.2, Math.PI * 0.75);
  ctx.stroke();

  // Fiocchetto azzurro
  ctx.fillStyle = plushLightBlue;
  ctx.beginPath();
  ctx.arc(-2, 6, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Fumetto animato sopra Totò: "Tatà! ❤️"
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
  ctx.strokeStyle = "#0288D1";
  ctx.lineWidth = 1.5;
  const bubbleX = x - 25;
  const bubbleY = y - 35 + hop;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(bubbleX, bubbleY, 80, 24, 8) : ctx.rect(bubbleX, bubbleY, 80, 24);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#01579B";
  ctx.font = "bold 11px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Tatà! ❤️", bubbleX + 40, bubbleY + 16);
  ctx.restore();
}

// Barriera di Ghiaccio (blocca il passaggio finché l'Orso non viene eliminato)
function drawIceBarrier(x, y) {
  const bear = enemies.find(e => e.type === 'orso');
  if (!bear || !bear.alive) return; // Se l'Orso è sconfitto la barriera crolla!

  ctx.save();
  // Cristalli di ghiaccio acuminati
  ctx.fillStyle = "#B2EBF2";
  ctx.strokeStyle = "#00BCD4";
  ctx.lineWidth = 2.5;

  const spikes = [
    { ox: 0,  h: 65, w: 18 },
    { ox: 16, h: 88, w: 22 },
    { ox: 36, h: 60, w: 18 }
  ];

  spikes.forEach(s => {
    ctx.beginPath();
    ctx.moveTo(x + s.ox, y);
    ctx.lineTo(x + s.ox + s.w / 2, y - s.h);
    ctx.lineTo(x + s.ox + s.w, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Sfumatura interna ghiaccio
    ctx.fillStyle = "#E0F7FA";
    ctx.beginPath();
    ctx.moveTo(x + s.ox + 3, y);
    ctx.lineTo(x + s.ox + s.w / 2, y - s.h + 5);
    ctx.lineTo(x + s.ox + s.w / 2, y);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#B2EBF2";
  });

  // Cartello di divieto / pericolo sul ghiaccio
  ctx.fillStyle = "#D32F2F";
  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x - 22, y - 116, 96, 24, 6) : ctx.rect(x - 22, y - 116, 96, 24);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 11px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⛔ BLOCCATO!", x + 26, y - 100);

  ctx.restore();
}

// 1. MONTAGNE APPENNINICHE DI INTRODACQUA (Parallasse 0.12x)
function drawIntrodacquaMountains(camX) {
  ctx.save();
  ctx.translate(-camX * 0.12, 0);

  // Sagome delle vette appenniniche maestose
  const peaks = [
    { x: -80,  w: 380, h: 290, color: "#546E7A" },
    { x: 220,  w: 420, h: 340, color: "#455A64" },
    { x: 580,  w: 360, h: 270, color: "#546E7A" },
    { x: 860,  w: 440, h: 360, color: "#37474F" },
    { x: 1220, w: 380, h: 300, color: "#455A64" },
    { x: 1540, w: 450, h: 350, color: "#546E7A" },
    { x: 1920, w: 400, h: 290, color: "#455A64" },
    { x: 2260, w: 460, h: 370, color: "#37474F" },
    { x: 2650, w: 390, h: 310, color: "#546E7A" },
    { x: 2980, w: 430, h: 340, color: "#455A64" },
    { x: 3350, w: 420, h: 360, color: "#37474F" },
    { x: 3720, w: 400, h: 300, color: "#546E7A" },
    { x: 4060, w: 460, h: 370, color: "#455A64" },
    { x: 4460, w: 420, h: 330, color: "#37474F" }
  ];

  peaks.forEach(p => {
    // Gradiente roccioso montano
    const grad = ctx.createLinearGradient(p.x + p.w / 2, 380 - p.h, p.x + p.w / 2, 380);
    grad.addColorStop(0, "#78909C");
    grad.addColorStop(0.5, p.color);
    grad.addColorStop(1, "#37474F");
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(p.x, 380);
    ctx.lineTo(p.x + p.w * 0.48, 380 - p.h);
    ctx.lineTo(p.x + p.w, 380);
    ctx.closePath();
    ctx.fill();

    // Creste e sfaccettature di luce
    ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
    ctx.beginPath();
    ctx.moveTo(p.x + p.w * 0.48, 380 - p.h);
    ctx.lineTo(p.x + p.w * 0.52, 380 - p.h * 0.75);
    ctx.lineTo(p.x + p.w * 0.46, 380);
    ctx.lineTo(p.x + p.w * 0.48, 380 - p.h);
    ctx.closePath();
    ctx.fill();
  });

  ctx.restore();
}

function drawIntrodacquaForestHills(camX) {

}

// 3. LA STALLA DI MULAN (x = 20, partenza Missione 2)
function drawMulanStable(x, y) {
  ctx.save();

  // Mura in legno massiccio caldo della stalla
  ctx.fillStyle = "#6D4C41";
  ctx.fillRect(x, y - 110, 160, 110);

  // Assi verticali di legno con venature
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 2;
  for (let ax = x + 20; ax < x + 160; ax += 20) {
    ctx.beginPath();
    ctx.moveTo(ax, y - 110);
    ctx.lineTo(ax, y);
    ctx.stroke();
  }

  // Tetto a capanna con scandole e fieno sporgente
  ctx.fillStyle = "#8D6E63";
  ctx.beginPath();
  ctx.moveTo(x - 15, y - 110);
  ctx.lineTo(x + 80, y - 165);
  ctx.lineTo(x + 175, y - 110);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#3E2723";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Fieno dorato che fuoriesce dalle fessure del tetto
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.ellipse(x + 40, y - 112, 14, 5, 0.1, 0, Math.PI * 2);
  ctx.ellipse(x + 120, y - 112, 16, 5, -0.1, 0, Math.PI * 2);
  ctx.fill();

  // Grande porta della stalla ad arco in legno scuro
  ctx.fillStyle = "#3E2723";
  ctx.beginPath();
  ctx.roundRect(x + 35, y - 85, 90, 85, [30, 30, 0, 0]);
  ctx.fill();

  // Se l'intro è in corso, portone leggermente aperto verso l'interno
  ctx.fillStyle = "#1B0D08";
  ctx.beginPath();
  ctx.roundRect(x + 45, y - 80, 70, 80, [25, 25, 0, 0]);
  ctx.fill();

  // Finestrella rotonda con fieno
  ctx.fillStyle = "#FFECB3";
  ctx.beginPath();
  ctx.arc(x + 80, y - 130, 15, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 65, y - 130); ctx.lineTo(x + 95, y - 130);
  ctx.moveTo(x + 80, y - 145); ctx.lineTo(x + 80, y - 115);
  ctx.stroke();

  // Insegna in legno sagomato: "🐴 LA STALLA DI MULAN"
  ctx.fillStyle = "#FFF8E1";
  ctx.roundRect ? ctx.roundRect(x + 10, y - 105, 140, 22, 6) : ctx.fillRect(x + 10, y - 105, 140, 22);
  ctx.fill();
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = "#5D4037";
  ctx.font = "bold 11px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🐴 STALLA DI MULAN", x + 80, y - 90);

  // Mangiatoia esterna con fieno fresco e ferro di cavallo portafortuna
  ctx.fillStyle = "#795548";
  ctx.fillRect(x + 165, y - 35, 45, 35);
  ctx.fillStyle = "#FFE082";
  ctx.beginPath();
  ctx.ellipse(x + 187, y - 35, 22, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// 4. BARRIERA DI ROVI E RADICI INTRECCIATE (Missione 2, a guardia dell'avena finché il lupo è vivo)
function drawThornBarrier(x, y) {
  const bossWolf = enemies.find(e => e.type === 'lupo');
  if (!bossWolf || !bossWolf.alive) return;

  ctx.save();
  // Intreccio di radici nodose e cespugli di rovi spinosi scuri
  ctx.fillStyle = "#3E2723";
  ctx.beginPath();
  ctx.moveTo(x - 10, y);
  ctx.quadraticCurveTo(x + 20, y - 60, x + 5, y - 120);
  ctx.quadraticCurveTo(x + 35, y - 80, x + 40, y);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#2E7D32";
  ctx.beginPath();
  ctx.arc(x + 10, y - 40, 24, 0, Math.PI * 2);
  ctx.arc(x + 25, y - 75, 20, 0, Math.PI * 2);
  ctx.arc(x + 15, y - 105, 18, 0, Math.PI * 2);
  ctx.fill();

  // Spine acuminate
  ctx.fillStyle = "#1B5E20";
  const thorns = [[x - 4, y - 35], [x + 34, y - 50], [x - 2, y - 80], [x + 32, y - 95]];
  thorns.forEach(([tx, ty]) => {
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - 6, ty - 4);
    ctx.lineTo(tx, ty - 8);
    ctx.closePath();
    ctx.fill();
  });

  // Cartello "ROVI IMPENETRABILI - SCONFIGGI IL LUPO!"
  ctx.fillStyle = "#D32F2F";
  ctx.strokeStyle = "#FFCDD2";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x - 30, y - 145, 110, 26, 6) : ctx.rect(x - 30, y - 145, 110, 26);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 10px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🐺 BATTI IL LUPO!", x + 25, y - 128);

  ctx.restore();
}

// 6. PARTICELLE DI SCIVOLAMENTO (FANGO E GOCCE D'ACQUA)
function drawSlideParticles() {
  for (let i = slideParticles.length - 1; i >= 0; i--) {
    const p = slideParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.035;
    p.radius *= 0.96;

    if (p.alpha <= 0 || p.radius <= 0.5) {
      slideParticles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// 7. INTRO CUTSCENE MISSIONE 2: MULAN ESCE DALLA STALLA E TATÀ SALE IN GROPPA!
function updateAndDrawM2Intro() {
  m2Intro.timer++;

  // Step 1 (0-60): Mulan fa capolino ed esce dalla stalla trotterellando verso Tatà
  if (m2Intro.timer < 60) {
    m2Intro.mulanX = 60 + (m2Intro.timer / 60) * 80;
    // Disegna Mulan da sola mentre esce
    drawMulanOnly(m2Intro.mulanX, 332, 1, m2Intro.timer * 0.2);
    // Disegna Tatà che la aspetta con le orecchie tese
    drawTata(m2Intro.tataX, m2Intro.tataY - 36, -1);

    // Fumetto di Mulan
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.roundRect(m2Intro.mulanX + 10, 270, 75, 26, 8);
    ctx.fill();
    ctx.fillStyle = "#5D4037";
    ctx.font = "bold 13px 'Comic Sans MS', sans-serif";
    ctx.fillText("I-oooh! 🌾", m2Intro.mulanX + 22, 288);
  }
  // Step 2 (60-100): Tatà salta in groppa a Mulan con un salto ad arco!
  else if (m2Intro.timer < 100) {
    const prog = (m2Intro.timer - 60) / 40;
    const currentTataX = 200 - prog * 55;
    const arcHeight = Math.sin(prog * Math.PI) * 45;
    const currentTataY = 300 - arcHeight;

    drawMulanOnly(140, 332, 1, 0);
    drawTata(currentTataX, currentTataY, -1);

    // Fumetto di Tatà
    ctx.fillStyle = "#FFE6ED";
    ctx.beginPath();
    ctx.roundRect(currentTataX - 10, currentTataY - 30, 95, 26, 8);
    ctx.fill();
    ctx.fillStyle = "#C2185B";
    ctx.font = "bold 12px 'Comic Sans MS', sans-serif";
    ctx.fillText("Hop! In sella! 🌸", currentTataX - 4, currentTataY - 13);
  }
  // Step 3 (100-140): Tatà è in sella, Mulan scalpita di gioia pronta a partire!
  else if (m2Intro.timer < 140) {
    const bounce = Math.sin(m2Intro.timer * 0.3) * 3;
    drawMulanWithTata(145, 328 - bounce, 1);

    // Fumetto di partenza per il Bosco di Introdacqua!
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.roundRect(110, 250, 190, 32, 10);
    ctx.fill();
    ctx.fillStyle = "#2E7D32";
    ctx.font = "bold 12px 'Comic Sans MS', sans-serif";
    ctx.fillText("Verso il Bosco di Introdacqua! 🌲", 118, 271);
  } else {
    // Cutscene terminata! Il giocatore prende il controllo di Tatà & Mulan!
    m2Intro.active = false;
    tata.x = 145;
    tata.y = 328;
    tata.facing = 1;
  }

  // Tasto per saltare la cutscene
  ctx.save();
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.beginPath();
  ctx.roundRect(cameraX + 220, 410, 360, 26, 12);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "bold 12px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Premi Spazio o tocca lo schermo per iniziare ▶️", cameraX + 400, 427);
  ctx.restore();
}

    { x: 4200, w: 480, h: 380, c1: "#8D6E63", c2: "#3E2723" }
  ];

  peaks.forEach(p => {
    const grad = ctx.createLinearGradient(p.x + p.w / 2, 380 - p.h, p.x + p.w / 2, 380);
    grad.addColorStop(0, "#D7CCC8");
    grad.addColorStop(0.3, p.c1);

    ctx.beginPath();

    ctx.fill();

  ctx.restore();
}

// 3. LA "TRATTORIA MAJELLA" A SANT'EUFEMIA (Partenza Missione 3)
function drawMajellaTrattoria(x, y) {
  ctx.save();

  // Pareti in pietra chiara locale della Majella
  ctx.fillStyle = "#EFEBE9";
  ctx.fillRect(x, y - 115, 160, 115);

  // Pietre a vista
  ctx.strokeStyle = "#BCAAA4";
  ctx.lineWidth = 1.5;
  for (let py = y - 100; py < y; py += 22) {
    ctx.beginPath();
    ctx.moveTo(x, py);
    ctx.lineTo(x + 160, py);
    ctx.stroke();
  }

  // Tetto in tegole rosse in cotto d'Abruzzo
  ctx.fillStyle = "#D32F2F";
  ctx.beginPath();
  ctx.moveTo(x - 15, y - 115);
  ctx.lineTo(x + 80, y - 165);
  ctx.lineTo(x + 175, y - 115);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#B71C1C";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Comignolo fumante
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(x + 120, y - 180, 24, 40);
  // Fumo animato dal camino
  const tTime = Date.now() * 0.003;
  ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
  for (let s = 0; s < 3; s++) {
    const sx = x + 132 + Math.sin(tTime + s) * 7;
    const sy = y - 190 - ((tTime * 20 + s * 14) % 35);
    ctx.beginPath();
    ctx.arc(sx, sy, 5 + s * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Finestra accogliente con tendine rosse
  ctx.fillStyle = "#FFF9C4";
  ctx.fillRect(x + 20, y - 85, 34, 34);
  ctx.strokeStyle = "#5D4037";
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 20, y - 85, 34, 34);

  // Tendine a quadretti
  ctx.fillStyle = "#EF5350";
  ctx.fillRect(x + 20, y - 85, 10, 34);
  ctx.fillRect(x + 44, y - 85, 10, 34);

  // Porta della trattoria in legno massiccio
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.roundRect(x + 70, y - 85, 40, 85, [15, 15, 0, 0]);
  ctx.fill();
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(x + 76, y - 42, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Insegna in legno: "🍲 TRATTORIA MAJELLA"
  ctx.fillStyle = "#FFF8E1";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x + 5, y - 110, 150, 22, 6) : ctx.rect(x + 5, y - 110, 150, 22);
  ctx.fill();
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = "#C2185B";
  ctx.font = "bold 11px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("🍲 TRATTORIA MAJELLA", x + 80, y - 95);

  // Tavolo all'aperto con tovaglia a quadretti e pranzetto
  ctx.fillStyle = "#6D4C41";
  ctx.fillRect(x + 165, y - 35, 45, 35);
  // Tovaglia a quadretti bianchi e rossi
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(x + 160, y - 42, 55, 12);
  ctx.fillStyle = "#E53935";
  for (let q = 0; q < 5; q++) {
    ctx.fillRect(x + 162 + q * 10, y - 42, 5, 12);
  }
  // Piatto fumante di tagliatelle e caldarroste
  ctx.fillStyle = "#FFECB3";
  ctx.beginPath();
  ctx.ellipse(x + 185, y - 44, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFB300";
  ctx.beginPath();
  ctx.ellipse(x + 185, y - 46, 7, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// 7. FOGLIE AUTUNNALI FLUTTUANTI NEL VENTO
function drawAutumnLeaves() {
  const time = Date.now() * 0.003;
  autumnLeaves.forEach(leaf => {
    leaf.y += leaf.vy;
    leaf.x += Math.sin(time + leaf.y * 0.02) * 1.2 + leaf.vx * 0.4;
    leaf.rot += leaf.vRot;

    if (leaf.y > 450) {
      leaf.y = -15;
      leaf.x = Math.random() * 800;
    }
    if (leaf.x > 800) leaf.x = 0;
    if (leaf.x < 0) leaf.x = 800;

    ctx.save();
    ctx.translate(leaf.x, leaf.y);
    ctx.rotate(leaf.rot);
    ctx.fillStyle = leaf.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, leaf.size, leaf.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// Case in pietra calcarea tipiche del borgo montano di Sant'Eufemia
function drawSantEufemiaVillageHouse(x, y, variant = 1) {
  ctx.save();
  const w = (variant === 2) ? 130 : 110;
  const h = (variant === 1) ? 135 : (variant === 2 ? 150 : 125);

  // Facciata in pietra viva squadrata della Majella
  const wallGrad = ctx.createLinearGradient(x, y - h, x + w, y);
  wallGrad.addColorStop(0, "#ECEFF1");
  wallGrad.addColorStop(0.5, "#CFD8DC");
  wallGrad.addColorStop(1, "#B0BEC5");
  ctx.fillStyle = wallGrad;
  ctx.fillRect(x, y - h, w, h);
  ctx.strokeStyle = "#78909C";
  ctx.lineWidth = 1.8;
  ctx.strokeRect(x, y - h, w, h);

  // Texture mattoncini in pietra
  ctx.strokeStyle = "rgba(69, 90, 100, 0.25)";
  ctx.lineWidth = 1;
  for (let rY = y - h + 15; rY < y - 5; rY += 16) {
    ctx.beginPath();
    ctx.moveTo(x, rY);
    ctx.lineTo(x + w, rY);
    ctx.stroke();
    const shift = (Math.floor(rY / 16) % 2) * 18;
    for (let cX = x + shift; cX < x + w; cX += 36) {
      ctx.beginPath();
      ctx.moveTo(cX, rY);
      ctx.lineTo(cX, rY + 16);
      ctx.stroke();
    }
  }

  // Tetto a spiovente in coppi in terracotta abruzzesi
  ctx.fillStyle = "#BF360C";
  ctx.beginPath();
  ctx.moveTo(x - 12, y - h);
  ctx.lineTo(x + w / 2, y - h - 35);
  ctx.lineTo(x + w + 12, y - h);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#870000";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Comignolo in cotto con fumo leggero
  ctx.fillStyle = "#D84315";
  ctx.fillRect(x + w - 24, y - h - 42, 14, 25);
  ctx.fillStyle = "#3E2723";
  ctx.fillRect(x - 2 + w - 24, y - h - 45, 18, 4);

  // Porta ad arco in legno scuro massiccio
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x + 20, y - 52, 28, 52, [14, 14, 0, 0]) : ctx.rect(x + 20, y - 52, 28, 52);
  ctx.fill();
  ctx.strokeStyle = "#3E2723";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Pomolo in ferro
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(x + 43, y - 24, 2, 0, Math.PI * 2);
  ctx.fill();

  // Finestre con persiane in legno e davanzale fiorito
  const winX = x + w - 42;
  const winY = y - h + 25;
  ctx.fillStyle = "#FFE082";
  ctx.fillRect(winX, winY, 24, 28);
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(winX, winY, 24, 28);
  // Persiana aperta
  ctx.fillStyle = "#6D4C41";
  ctx.fillRect(winX - 10, winY, 10, 28);
  ctx.fillRect(winX + 24, winY, 10, 28);

  // Vaso di fiori sul davanzale
  ctx.fillStyle = "#D84315";
  ctx.fillRect(winX - 2, winY + 26, 28, 5);
  ctx.fillStyle = "#E91E63";
  ctx.beginPath();
  ctx.arc(winX + 4, winY + 24, 3, 0, Math.PI * 2);
  ctx.arc(winX + 12, winY + 23, 3.5, 0, Math.PI * 2);
  ctx.arc(winX + 20, winY + 24, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// 10. INTRO CUTSCENE MISSIONE 3: SANT'EUFEMIA E TRATTORIA MAJELLA
function updateAndDrawM3Intro() {
  m3Intro.timer++;

  // Step 1 (0-60): Tatà sazio davanti alla Trattoria Majella
  if (m3Intro.timer < 60) {
    drawTata(180, 336, 1);

    // Fumetto di Tatà sazio
    ctx.fillStyle = "#FFE6ED";
    ctx.beginPath();
    ctx.roundRect(140, 275, 120, 26, 8);

    ctx.fillStyle = "#C2185B";
    ctx.font = "bold 11px 'Comic Sans MS', sans-serif";
    ctx.fillText("Che buon pranzo! 🍲", 148, 292);
  }
  // Step 2 (60-110): Arriva l'abitante del paese che chiede aiuto
  else if (m3Intro.timer < 110) {
    drawTata(180, 336, 1);

    // Abitante dudù
    ctx.fillStyle = "#8D6E63";
    ctx.beginPath();
    ctx.ellipse(260, 350, 10, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#D7CCC8";
    ctx.beginPath();
    ctx.arc(260, 330, 8, 0, Math.PI * 2);
    ctx.fill();

    // Fumetto dell'abitante
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.roundRect(160, 260, 220, 36, 10);
    ctx.fill();
    ctx.fillStyle = "#D32F2F";
    ctx.font = "bold 11px 'Comic Sans MS', sans-serif";
    ctx.fillText("Tatà aiuto! La fontana è a secco!", 170, 276);
    ctx.fillText("Un masso blocca Fonte Lama Bianca!", 170, 290);
  }
  // Step 3 (110-150): Tatà scatta pronto per la missione!
  else if (m3Intro.timer < 150) {
    const hop = Math.abs(Math.sin(m3Intro.timer * 0.25)) * 8;
    drawTata(180, 336 - hop, 1);

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.roundRect(130, 265, 230, 32, 10);
    ctx.fill();

    ctx.font = "bold 11px 'Comic Sans MS', sans-serif";
    ctx.fillText("Attraverso il borgo e salgo! 🏘️💧", 138, 285);
  } else {
    // Cutscene terminata!
    m3Intro.active = false;
    tata.x = 180;
    tata.y = 336;
    tata.facing = 1;
  }

  // Tasto per saltare la cutscene
  ctx.save();
  ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
  ctx.beginPath();
  ctx.roundRect(cameraX + 220, 410, 360, 26, 12);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";

  ctx.textAlign = "center";
  ctx.fillText("Premi Spazio o tocca lo schermo per iniziare ▶️", cameraX + 400, 427);
  ctx.restore();
}

// Montagne maestose delle Gole di Bocca di Valle (Guardiagrele / Majella)
function drawBoccaDiValleMountains(camX) {
  ctx.save();
  const px = camX * 0.12;

  // Cielo alpino cristallino
  const skyGrad = ctx.createLinearGradient(0, 0, 0, 450);
  skyGrad.addColorStop(0, "#283593");
  skyGrad.addColorStop(0.35, "#3F51B5");
  skyGrad.addColorStop(0.7, "#7986CB");
  skyGrad.addColorStop(1, "#E8EAF6");
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, 800, 450);

  // Gole e pareti rocciose di Bocca di Valle
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.moveTo(0, 450);
  for (let x = -100; x <= 950; x += 120) {
    const worldX = x + px;
    const peakH = 140 + Math.sin(worldX * 0.0035) * 65 + Math.cos(worldX * 0.007) * 45;
    ctx.lineTo(x, 450 - peakH);
  }
  ctx.lineTo(800, 450);
  ctx.closePath();
  ctx.fill();

  // Cresta rocciosa scura ravvicinata
  ctx.fillStyle = "#263238";
  ctx.beginPath();
  ctx.moveTo(0, 450);
  for (let x = -100; x <= 950; x += 90) {
    const worldX = x + px * 1.5;
    const peakH = 90 + Math.sin(worldX * 0.005) * 40;
    ctx.lineTo(x, 450 - peakH);
  }
  ctx.lineTo(800, 450);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

}

// Bicicletta della vittoria (Premio per sbloccare la Missione 5)
function drawBicycle(x, y) {
  ctx.save();
  const time = Date.now() * 0.005;

  // Bagliore dorato radioso attorno alla bici
  const glow = ctx.createRadialGradient(x + 30, y - 22, 5, x + 30, y - 22, 50);
  glow.addColorStop(0, "rgba(255, 238, 88, 0.45)");
  glow.addColorStop(0.7, "rgba(255, 193, 7, 0.2)");
  glow.addColorStop(1, "rgba(255, 193, 7, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x + 30, y - 22, 50, 0, Math.PI * 2);
  ctx.fill();

  // Ruota Posteriore (x = x + 10, y = y - 14)
  ctx.strokeStyle = "#212121";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(x + 10, y - 14, 14, 0, Math.PI * 2);
  ctx.stroke();

  // Raggi ruota posteriore
  ctx.strokeStyle = "#B0BEC5";
  ctx.lineWidth = 1;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
    ctx.beginPath();
    ctx.moveTo(x + 10, y - 14);
    ctx.lineTo(x + 10 + Math.cos(a) * 14, y - 14 + Math.sin(a) * 14);
    ctx.stroke();
  }

  // Ruota Anteriore (x = x + 50, y = y - 14)
  ctx.strokeStyle = "#212121";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.arc(x + 50, y - 14, 14, 0, Math.PI * 2);
  ctx.stroke();

  // Raggi ruota anteriore
  ctx.strokeStyle = "#B0BEC5";
  ctx.lineWidth = 1;
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 3) {
    ctx.beginPath();
    ctx.moveTo(x + 50, y - 14);
    ctx.lineTo(x + 50 + Math.cos(a) * 14, y - 14 + Math.sin(a) * 14);
    ctx.stroke();
  }

  // Mozzi ruote
  ctx.fillStyle = "#78909C";
  ctx.beginPath();
  ctx.arc(x + 10, y - 14, 3, 0, Math.PI * 2);
  ctx.arc(x + 50, y - 14, 3, 0, Math.PI * 2);
  ctx.fill();

  // Telaio sportivo rosso fiammante
  ctx.strokeStyle = "#E53935";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Triangolo posteriore
  ctx.beginPath();
  ctx.moveTo(x + 10, y - 14); // Mozzo posteriore
  ctx.lineTo(x + 24, y - 32); // Nodo sella
  ctx.lineTo(x + 28, y - 14); // Movimento centrale
  ctx.lineTo(x + 10, y - 14); // Chiusura triangolo posteriore
  ctx.stroke();

  // Triangolo anteriore
  ctx.beginPath();
  ctx.moveTo(x + 28, y - 14); // Movimento centrale
  ctx.lineTo(x + 44, y - 34); // Tubo sterzo
  ctx.lineTo(x + 24, y - 32); // Tubo orizzontale verso sella
  ctx.moveTo(x + 44, y - 34);
  ctx.lineTo(x + 50, y - 14); // Forcella anteriore
  ctx.stroke();

  // Corona e catena
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.arc(x + 28, y - 14, 4.5, 0, Math.PI * 2);
  ctx.fill();

  // Pedale
  ctx.strokeStyle = "#263238";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 28, y - 14);
  ctx.lineTo(x + 28 + Math.cos(time) * 6, y - 14 + Math.sin(time) * 6);
  ctx.stroke();

  // Sella ergonomica in cuoio marrone
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();

// 1. TATÀ IN BICICLETTA (ANIMATO & REATTIVO)
function drawTataOnBicycle(x, y, facing = 1, isBraking = false) {
  ctx.save();
  ctx.translate(x, y);

  if (facing === -1) {
    ctx.translate(56, 0);
    ctx.scale(-1, 1);
  }

  const animTime = (tata.x * 0.12);
  const pedalAngle = animTime % (Math.PI * 2);

  // Scintille o fumo di frenata alla ruota posteriore
  if (isBraking && tata.grounded) {
    ctx.save();
    ctx.fillStyle = (Math.random() < 0.5) ? "#FFD54F" : "#FF5722";
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(10 - Math.random() * 8, 44 + Math.random() * 5, Math.random() * 2.5 + 1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // --- RUOTE DELLA BICICLETTA ---
  const drawWheel = (wx, wy) => {
    ctx.save();
    // Pneumatico scolpito da mountain bike
    ctx.strokeStyle = "#263238";
    ctx.lineWidth = 4.5;
    ctx.beginPath();
    ctx.arc(wx, wy, 10, 0, Math.PI * 2);
    ctx.stroke();

    // Cerchione metallico
    ctx.strokeStyle = "#CFD8DC";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(wx, wy, 8, 0, Math.PI * 2);
    ctx.stroke();

    // Mozzo centrale
    ctx.fillStyle = "#37474F";
    ctx.beginPath();
    ctx.arc(wx, wy, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Raggi ruota in rotazione
    ctx.strokeStyle = "rgba(176, 190, 197, 0.85)";
    ctx.lineWidth = 1;
    for (let a = 0; a < 4; a++) {
      const spAng = pedalAngle + a * (Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + Math.cos(spAng) * 7.5, wy + Math.sin(spAng) * 7.5);
      ctx.stroke();
    }
    ctx.restore();
  };

  // Ruota posteriore (x=11, y=42) e Ruota anteriore (x=46, y=42)
  drawWheel(11, 42);
  drawWheel(46, 42);

  // Catarifrangente posteriore rosso
  ctx.fillStyle = isBraking ? "#FF1744" : "#D32F2F";
  ctx.beginPath();
  ctx.arc(6, 32, isBraking ? 3 : 2, 0, Math.PI * 2);
  ctx.fill();

  // --- TELAIO DELLA BICICLETTA (Azzurro Turchese Brillante) ---
  ctx.strokeStyle = "#00ACC1";
  ctx.lineWidth = 3.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Triangolo posteriore e tubo obliquo
  ctx.beginPath();
  ctx.moveTo(11, 42); // Mozzo posteriore
  ctx.lineTo(26, 40); // Movimento centrale (pedali)
  ctx.lineTo(22, 28); // Nodo sella
  ctx.closePath();
  ctx.stroke();

  // Triangolo principale: movimento centrale -> cannotto sterzo -> nodo sella
  ctx.beginPath();
  ctx.moveTo(26, 40);
  ctx.lineTo(41, 23); // Cannotto di sterzo
  ctx.lineTo(22, 28);
  ctx.stroke();

  // Forcella anteriore (cannotto sterzo -> mozzo anteriore)
  ctx.strokeStyle = "#00838F";
  ctx.lineWidth = 2.8;
  ctx.beginPath();
  ctx.moveTo(41, 23);
  ctx.lineTo(46, 42);
  ctx.stroke();

  // Manubrio con pipa e manopole ergonomiche
  ctx.strokeStyle = "#455A64";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(41, 23);
  ctx.lineTo(42, 16);
  ctx.lineTo(45, 15);
  ctx.stroke();

  // Campanello d'oro sul manubrio
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(43, 14, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Sellino sportivo nero con molla
  ctx.fillStyle = "#212121";
  ctx.beginPath();
  ctx.ellipse(21, 27, 6, 2.5, -0.15, 0, Math.PI * 2);
  ctx.fill();

  // Guarnitura, pedivelle e pedali
  const pedX1 = 26 + Math.cos(pedalAngle) * 6;
  const pedY1 = 40 + Math.sin(pedalAngle) * 6;
  const pedX2 = 26 - Math.cos(pedalAngle) * 6;
  const pedY2 = 40 - Math.sin(pedalAngle) * 6;

  ctx.strokeStyle = "#78909C";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pedX1, pedY1);
  ctx.lineTo(pedX2, pedY2);
  ctx.stroke();

  ctx.fillStyle = "#37474F";
  ctx.fillRect(pedX1 - 2, pedY1 - 1.5, 4, 3);
  ctx.fillRect(pedX2 - 2, pedY2 - 1.5, 4, 3);

  // --- TATÀ IN SELLA ALLA BICICLETTA (DUDÙ ROSA PASTELLO ORIGINALE) ---
  // Palette originale Dudù di Tatà
  const plushPink = "#F8A4B8";       // Rosa principale del peluche dudù
  const plushLightPink = "#FFE6ED";  // Rosa chiaro per interno orecchie, dettagli e nodini
  const stitchColor = "#D4708A";     // Cuciture decorative a vista
  const threadDark = "#4A2828";      // Filo ricamato scuro per occhi e bocca

  // Lampeggio se Tatà è stato colpito recentemente
  if (tata.hurtTimer > 0 && Math.floor(tata.hurtTimer / 4) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  // Gambette e zampine di Tatà sui pedali
  ctx.strokeStyle = plushPink;
  ctx.lineWidth = 3.8;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(22, 27);
  ctx.lineTo(pedX1, pedY1);
  ctx.stroke();

  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(pedX1, pedY1, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Codina soffice a pon-pon rosa chiaro
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(13, 24, 5, 0, Math.PI * 2);
  ctx.fill();

  // Corpicino a "copertina / fazzoletto" tipico del Dudù
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.moveTo(18, 20);
  ctx.quadraticCurveTo(10, 24, 12, 30); // nodino posteriore
  ctx.quadraticCurveTo(20, 27, 26, 30); // nodino anteriore
  ctx.quadraticCurveTo(32, 24, 30, 18); // verso il collo
  ctx.closePath();
  ctx.fill();

  // Nodini tipici agli angoli del fazzoletto dudù
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(12, 30, 2.4, 0, Math.PI * 2);
  ctx.arc(26, 30, 2.4, 0, Math.PI * 2);
  ctx.fill();

  // Cuciture decorative a vista sul corpicino
  ctx.save();
  ctx.strokeStyle = stitchColor;
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 1.8]);
  ctx.beginPath();
  ctx.moveTo(14, 28);
  ctx.quadraticCurveTo(20, 25, 25, 28);
  ctx.stroke();
  ctx.restore();

  // Toppa a cuoricino ricamata sul petto di Tatà
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(21, 21, 1.8, 0, Math.PI * 2);
  ctx.arc(24, 21, 1.8, 0, Math.PI * 2);
  ctx.lineTo(22.5, 24.5);
  ctx.closePath();
  ctx.fill();

  // Braccine morbide dudù di Tatà tese verso il manubrio
  ctx.strokeStyle = plushPink;
  ctx.lineWidth = 3.6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(27, 18);
  ctx.lineTo(43, 16);
  ctx.stroke();

  // Zampine anteriori rosa chiaro sui comandi
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(43, 16, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Fiocchetto al collo tipico di Tatà
  ctx.fillStyle = "#E91E63";
  ctx.beginPath();
  ctx.ellipse(28, 17, 2.2, 1.4, 0.4, 0, Math.PI * 2);
  ctx.ellipse(30, 16, 2.2, 1.4, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(29, 16.5, 1, 0, Math.PI * 2);
  ctx.fill();

  // --- TESTOLINA MORBIDA E DOLCE DI TATÀ (SENZA CASCO) ---
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.arc(33, 12, 9, 0, Math.PI * 2);
  ctx.fill();

  // Guancia morbida rosata
  ctx.fillStyle = "#FF7C9C";
  ctx.beginPath();
  ctx.arc(37, 14.5, 2.6, 0, Math.PI * 2);
  ctx.fill();

  // Musetto e bocca ricamata
  ctx.fillStyle = "#E75480";
  ctx.beginPath();
  ctx.ellipse(39.5, 12.5, 1.8, 1.3, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = threadDark;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(38, 14, 2, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Occhietto ricamato con filo scuro e doppio sparkle bianco
  ctx.fillStyle = threadDark;
  ctx.beginPath();
  ctx.arc(36, 10, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(36.7, 9.3, 0.9, 0, Math.PI * 2);
  ctx.arc(35.3, 10.6, 0.45, 0, Math.PI * 2);
  ctx.fill();

  // --- ORECCHIE LUNGHE E MORBIDE DA DUDÙ (AL VENTO DELLA DISCESA!) ---
  const windSway = Math.sin(Date.now() * 0.015) * 2.5;

  // Orecchio posteriore (sinistro)
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(24, 3 + windSway, 4.8, 13, -0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.ellipse(24, 3 + windSway, 2.6, 9, -0.42, 0, Math.PI * 2);
  ctx.fill();

  // Orecchio anteriore (destro) con cucitura decorativa tratteggiata
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(27, 1 - windSway, 5, 14, -0.32, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.ellipse(27, 1 - windSway, 2.8, 9.5, -0.32, 0, Math.PI * 2);
  ctx.fill();

  // Cuciture decorative a tratteggio sull'orecchio
  ctx.save();
  ctx.strokeStyle = stitchColor;
  ctx.lineWidth = 0.9;
  ctx.setLineDash([2, 1.8]);
  ctx.beginPath();
  ctx.ellipse(27, 1 - windSway, 4.6, 12.5, -0.32, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  ctx.restore();
}

// 2. GIULIA (AMICHETTA DI 6 ANNI CON OCCHIALETTI LILLA E CODINI CASTANI)
function drawGiulia(x, y) {
  ctx.save();
  ctx.translate(x, y);

  const bob = Math.sin(Date.now() * 0.005) * 2;

  // Gambette e scarpette da ginnastica lilla
  ctx.fillStyle = "#FFE0B2"; // Gambe pelle
  ctx.fillRect(11, 32 + bob, 5, 8);
  ctx.fillRect(22, 32 + bob, 5, 8);

  // Calzini bianchi
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(10, 37 + bob, 7, 3);
  ctx.fillRect(21, 37 + bob, 7, 3);

  // Scarpette lilla
  ctx.fillStyle = "#BA68C8";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(8, 40 + bob, 10, 6, 3) : ctx.rect(8, 40 + bob, 10, 6);
  ctx.roundRect ? ctx.roundRect(20, 40 + bob, 10, 6, 3) : ctx.rect(20, 40 + bob, 10, 6);
  ctx.fill();

  // Suola bianca scarpette
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(8, 44 + bob, 10, 2);
  ctx.fillRect(20, 44 + bob, 10, 2);

  // Vestitino giallo solare a pois bianchi
  ctx.fillStyle = "#FDD835";
  ctx.beginPath();
  ctx.moveTo(14, 16 + bob);
  ctx.lineTo(24, 16 + bob);
  ctx.lineTo(31, 33 + bob);
  ctx.lineTo(7, 33 + bob);
  ctx.closePath();
  ctx.fill();

  // Colletto bianco del vestito
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.ellipse(19, 17 + bob, 6, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pois bianchi sul vestito
  ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
  const dots = [[13, 22], [23, 23], [18, 27], [12, 30], [25, 30]];
  dots.forEach(([dx, dy]) => {
    ctx.beginPath();
    ctx.arc(dx, dy + bob, 1.8, 0, Math.PI * 2);
    ctx.fill();
  });

  // Braccia aperte in segno di gioia e accoglienza
  ctx.strokeStyle = "#FFE0B2";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";

  // Braccio sinistro
  ctx.beginPath();
  ctx.moveTo(14, 18 + bob);
  ctx.lineTo(3, 14 + bob);
  ctx.stroke();

  // Braccio destro che porge il disegno
  ctx.beginPath();
  ctx.moveTo(24, 18 + bob);
  ctx.lineTo(33, 16 + bob);
  ctx.stroke();

  // Manine rosee
  ctx.fillStyle = "#FFE0B2";
  ctx.beginPath();
  ctx.arc(2, 14 + bob, 2.5, 0, Math.PI * 2);
  ctx.arc(34, 16 + bob, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Disegno tenuto nella mano destra
  drawGiuliaDrawing(30, 8 + bob, 0.75);

  // --- TESTA DI GIULIA ---
  // Faccina dolce e rotonda di bimba
  ctx.fillStyle = "#FFE0B2";
  ctx.beginPath();
  ctx.arc(19, 10 + bob, 9.5, 0, Math.PI * 2);
  ctx.fill();

  // Guance rosee fanciullesche
  ctx.fillStyle = "#FF8A80";
  ctx.beginPath();
  ctx.arc(13, 12 + bob, 2.8, 0, Math.PI * 2);
  ctx.arc(25, 12 + bob, 2.8, 0, Math.PI * 2);
  ctx.fill();

  // Sorriso radioso
  ctx.strokeStyle = "#D84315";
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(19, 12.5 + bob, 3.5, 0.1, Math.PI - 0.1);
  ctx.stroke();

  // Occhietti castani che brillano
  ctx.fillStyle = "#4E342E";
  ctx.beginPath();
  ctx.arc(15, 9 + bob, 1.8, 0, Math.PI * 2);
  ctx.arc(23, 9 + bob, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(15.5, 8.5 + bob, 0.7, 0, Math.PI * 2);
  ctx.arc(23.5, 8.5 + bob, 0.7, 0, Math.PI * 2);
  ctx.fill();

  // OCCHIALI TONDI LILLA (Caratteristica distintiva di Giulia!)
  ctx.strokeStyle = "#AB47BC";
  ctx.lineWidth = 1.8;
  // Lente sinistra
  ctx.beginPath();
  ctx.arc(15, 9 + bob, 3.8, 0, Math.PI * 2);
  ctx.stroke();
  // Lente destra
  ctx.beginPath();
  ctx.arc(23, 9 + bob, 3.8, 0, Math.PI * 2);
  ctx.stroke();
  // Ponticello occhiali
  ctx.beginPath();
  ctx.moveTo(18.8, 9 + bob);
  ctx.lineTo(19.2, 9 + bob);
  ctx.stroke();
  // Stanghette
  ctx.beginPath();
  ctx.moveTo(11.2, 9 + bob);
  ctx.lineTo(9.5, 8 + bob);
  ctx.moveTo(26.8, 9 + bob);
  ctx.lineTo(28.5, 8 + bob);
  ctx.stroke();

  // Capelli castani lucidi con frangetta
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.arc(19, 7.5 + bob, 10.5, Math.PI * 0.9, Math.PI * 2.1);
  ctx.fill();

  // Frangetta simpatica
  ctx.beginPath();
  ctx.arc(15, 5 + bob, 4.5, 0, Math.PI);
  ctx.arc(19, 5.5 + bob, 4.5, 0, Math.PI);
  ctx.arc(23, 5 + bob, 4.5, 0, Math.PI);
  ctx.fill();

  // Due deliziosi codini laterali (Pigtails)
  const hairSway = Math.sin(Date.now() * 0.007) * 2;
  // Codino sinistro
  ctx.beginPath();
  ctx.ellipse(7, 6 + bob + hairSway, 5, 8, -0.6, 0, Math.PI * 2);
  ctx.fill();
  // Codino destro
  ctx.beginPath();
  ctx.ellipse(31, 6 + bob - hairSway, 5, 8, 0.6, 0, Math.PI * 2);
  ctx.fill();

  // Elastici lilla per i codini
  ctx.fillStyle = "#CE93D8";
  ctx.beginPath();

// 4. GRAN FORMAGGIO PUZZOLENTE (BOSS MISSIONE 5)
function drawStinkyCheeseBoss(en) {
  ctx.save();
  ctx.translate(en.x, en.y);

  const isSquished = en.squish > 0;
  const isHit = en.hitCooldown > 0;

  // Effetto schiacciamento / impatto
  if (isSquished) {
    ctx.scale(1.3, 0.35);
    ctx.translate(-8, 90);
    ctx.globalAlpha = Math.max(0.3, en.squish / 35);
  } else if (isHit) {
    ctx.translate(Math.sin(Date.now() * 0.08) * 4, 0);
  }

  // --- ONDE DI PUZZO VERDE ANIMATE (STINK FUMES) ---
  if (en.alive && !isSquished) {
    ctx.save();
    const fumeTime = Date.now() * 0.005;
    ctx.strokeStyle = "rgba(104, 159, 56, 0.55)";
    ctx.lineWidth = 2.5;
    ctx.lineCap = "round";

    for (let f = 0; f < 4; f++) {
      const startX = 14 + f * 14;
      ctx.beginPath();
      ctx.moveTo(startX, 10);
      const wave1 = Math.sin(fumeTime + f) * 8;
      const wave2 = Math.cos(fumeTime + f * 1.5) * 10;
      ctx.bezierCurveTo(startX + wave1, -6, startX + wave2, -18, startX + wave1 * 0.8, -28);
      ctx.stroke();

      // Bollicine di puzzo
      ctx.fillStyle = "rgba(139, 195, 74, 0.65)";
      ctx.beginPath();
      ctx.arc(startX + wave2, -16, 2.5, 0, Math.PI * 2);
      ctx.arc(startX + wave1 * 0.8, -28, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // --- FORMA DEL FORMAGGIO: GRANDE FETTA TRIANGOLARE ---
  // Base formaggio stagionato (giallo-arancio caldo)
  const cheeseGrad = ctx.createLinearGradient(0, 0, 68, 58);
  cheeseGrad.addColorStop(0, isHit ? "#FFF59D" : "#FFCA28");
  cheeseGrad.addColorStop(0.7, isHit ? "#FFE082" : "#FFA000");
  cheeseGrad.addColorStop(1, "#E65100");
  ctx.fillStyle = cheeseGrad;

  // Triangolo con angoli arrotondati
  ctx.beginPath();
  ctx.moveTo(8, 54);
  ctx.lineTo(62, 54);
  ctx.lineTo(60, 12);
  ctx.lineTo(8, 44);
  ctx.closePath();
  ctx.fill();

  // Crosta dura e spessa sul retro
  ctx.fillStyle = "#BF360C";
  ctx.beginPath();
  ctx.moveTo(60, 12);
  ctx.lineTo(65, 14);
  ctx.lineTo(66, 54);
  ctx.lineTo(62, 54);
  ctx.closePath();
  ctx.fill();

  // Bordo di contorno netto
  ctx.strokeStyle = "#D84315";
  ctx.lineWidth = 2.2;
  ctx.stroke();

  // --- BUCHI DEL FORMAGGIO (SWISS HOLES) ---
  ctx.fillStyle = "#FF8F00";
  const cheeseHoles = [
    [18, 46, 5],
    [32, 44, 7],
    [48, 48, 6],
    [38, 30, 6.5],
    [52, 28, 4.5],
    [46, 18, 4]
  ];
  cheeseHoles.forEach(([hx, hy, hr]) => {
    ctx.beginPath();
    ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fill();
    // Ombra interna del buco
    ctx.fillStyle = "rgba(191, 54, 12, 0.4)";
    ctx.beginPath();
    ctx.arc(hx - hr * 0.2, hy - hr * 0.2, hr * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#FF8F00";
  });

  // --- MACCHIE DI MUFFA VERDE BIZZARRE (IL TOCCO "PUZZOLENTE") ---
  ctx.fillStyle = "#558B2F"; // Verde muffa
  const moldSpots = [
    [14, 42, 4],
    [24, 48, 3],
    [42, 38, 4.5],
    [54, 20, 3.5],
    [28, 22, 4]
  ];
  moldSpots.forEach(([mx, my, mr]) => {
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#7CB342";
    ctx.beginPath();
    ctx.arc(mx + 1, my - 1, mr * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#558B2F";
  });

  // --- FACCIA BRONTOLONA E DIVERTENTE DEL FORMAGGIO ---
  // Sopracciglia arrabbiate da boss
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(18, 26);
  ctx.lineTo(27, 30);
  ctx.moveTo(37, 30);
  ctx.lineTo(28, 26);
  ctx.stroke();

  // Occhietti furiosi
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(21, 32, 4, 0, Math.PI * 2);
  ctx.arc(33, 32, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#212121";
  ctx.beginPath();
  ctx.arc(22, 33, 2, 0, Math.PI * 2);
  ctx.arc(32, 33, 2, 0, Math.PI * 2);
  ctx.fill();

  // Bocca arrabbiata con dente di formaggio
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(20, 40);
  ctx.quadraticCurveTo(27, 36, 34, 41);
  ctx.stroke();

  // Dente buffo
  ctx.fillStyle = "#FFF9C4";
  ctx.fillRect(25, 38, 3.5, 3.5);

  // --- BARRA DELLA VITA (4 CUORI / FORMAGGI) ---
  if (en.alive && !isSquished) {
    const barW = 60;
    const barX = (68 - barW) / 2;
    const barY = -12;

    ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(barX - 2, barY - 2, barW + 4, 14, 6) : ctx.rect(barX - 2, barY - 2, barW + 4, 14);
    ctx.fill();

    for (let h = 0; h < en.maxHp; h++) {
      const heartX = barX + 3 + h * 14;
      if (h < en.hp) {
        ctx.fillStyle = "#FFD54F"; // Formaggio pieno
        ctx.beginPath();
        ctx.arc(heartX + 5, barY + 5, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#E65100";
        ctx.beginPath();
        ctx.arc(heartX + 6, barY + 4, 1.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = "#78909C"; // Cuore perso
        ctx.beginPath();
        ctx.arc(heartX + 5, barY + 5, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  ctx.restore();
}

function drawDownhillPineHills(camX) {
  ctx.save();
  // Colline intermedie con foreste di pini e larici
  const hillGrad = ctx.createLinearGradient(0, 140, 0, 340);
  hillGrad.addColorStop(0, "#388E3C");
  hillGrad.addColorStop(1, "#1B5E20");
  ctx.fillStyle = hillGrad;

  const hOffset = -camX * 0.16;
  ctx.beginPath();
  ctx.moveTo(0, 340);
  for (let x = 0; x <= 1000; x += 60) {
    const worldX = x - hOffset;
    const y = 200 + Math.sin(worldX * 0.003) * 35 + Math.cos(worldX * 0.007) * 20;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(1000, 340);
  ctx.lineTo(0, 340);
  ctx.fill();

  // Sagome di pini alpini lungo i crinali
  ctx.fillStyle = "#1B5E20";
  for (let px = 20; px < 1000; px += 45) {
    const worldPX = px - hOffset;
    const py = 200 + Math.sin(worldPX * 0.003) * 35 + Math.cos(worldPX * 0.007) * 20;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px - 9, py + 18);
    ctx.lineTo(px + 9, py + 18);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px, py + 10);
    ctx.lineTo(px - 12, py + 28);
    ctx.lineTo(px + 12, py + 28);
    ctx.closePath();
    ctx.fill();
  }

  ctx.restore();
}

// 7. SCENOGRAFIA COMPLETA DISCESA (CARTELLI, PARAPETTI, BURRONI, CASETTA DI GIULIA)
function drawDownhillScenery() {

  // Palo in legno
  ctx.fillStyle = "#5D4037";

  const drawRoadSign = (sx, text, subtext) => {
    ctx.save();
    ctx.fillStyle = "#78909C";
    ctx.fillRect(sx + 10, 310, 4, 70);

    // Triangolo pericolo giallo
    ctx.fillStyle = "#FDD835";
    ctx.beginPath();
    ctx.moveTo(sx + 12, 275);
    ctx.lineTo(sx - 10, 310);
    ctx.lineTo(sx + 34, 310);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#D32F2F";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = "#212121";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(text, sx + 12, 302);

    if (subtext) {
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(sx - 15, 314, 54, 15, 3) : ctx.rect(sx - 15, 314, 54, 15);
      ctx.fill();
      ctx.fillStyle = "#D32F2F";
      ctx.font = "bold 8px 'Comic Sans MS', sans-serif";
      ctx.fillText(subtext, sx + 12, 325);
    }
    ctx.restore();
  };

  drawRoadSign(400, "⚠️", "SALTO!");
  drawRoadSign(1270, "🚀", "RAMPA");
  drawRoadSign(2220, "⚡", "CURVA");
  drawRoadSign(3240, "🧀", "ATTENTI!");

  // Stelle alpine (Edelweiss) e genziane blu sul bordo della strada
  const drawFlower = (fx, fy, isEdelweiss) => {
    ctx.save();
    if (isEdelweiss) {
      ctx.fillStyle = "#FFFFFF";
      for (let p = 0; p < 6; p++) {
        const ang = p * (Math.PI / 3);
        ctx.beginPath();
        ctx.ellipse(fx + Math.cos(ang) * 4, fy + Math.sin(ang) * 4, 3.5, 1.5, ang, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#FBC02D";
      ctx.beginPath();
      ctx.arc(fx, fy, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#1976D2"; // Genziana blu
      ctx.beginPath();
      ctx.arc(fx, fy, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#BBDEFB";
      ctx.beginPath();
      ctx.arc(fx, fy, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  };

  drawFlower(200, 375, true);
  drawFlower(310, 375, false);
  drawFlower(830, 375, true);
  drawFlower(1700, 375, false);
  drawFlower(2700, 375, true);
  drawFlower(3700, 375, false);

  // --- TRAGUARDO FINALE: CASETTA DI GIULIA (4480 - 4760px) ---
  ctx.save();
  const hx = 4590;
  const hy = 230;

  // Pareti dello chalet in legno alpino
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(hx, hy + 50, 140, 100);
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 1.8;
  ctx.strokeRect(hx, hy + 50, 140, 100);

  // Travi orizzontali dello chalet
  for (let by = hy + 65; by < hy + 150; by += 15) {
    ctx.beginPath();
    ctx.moveTo(hx, by);
    ctx.lineTo(hx + 140, by);
    ctx.stroke();
  }

  // Tetto a spiovente spiovente con tegole rosse
  ctx.fillStyle = "#C62828";
  ctx.beginPath();
  ctx.moveTo(hx - 20, hy + 50);
  ctx.lineTo(hx + 70, hy);
  ctx.lineTo(hx + 160, hy + 50);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#B71C1C";
  ctx.lineWidth = 3;
  ctx.stroke();

  // Comignolo con fumetto animato
  ctx.fillStyle = "#616161";
  ctx.fillRect(hx + 105, hy + 10, 18, 30);
  // Fumo camino
  const smokeTime = (Date.now() * 0.003) % 1;
  ctx.fillStyle = "rgba(224, 224, 224, 0.7)";
  ctx.beginPath();
  ctx.arc(hx + 114, hy - 5 - smokeTime * 25, 6 + smokeTime * 8, 0, Math.PI * 2);
  ctx.arc(hx + 118, hy - 25 - smokeTime * 25, 9 + smokeTime * 10, 0, Math.PI * 2);
  ctx.fill();

  // Finestrella fiorita al primo piano
  ctx.fillStyle = "#FFF9C4";
  ctx.fillRect(hx + 55, hy + 15, 30, 24);
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 2;
  ctx.strokeRect(hx + 55, hy + 15, 30, 24);
  ctx.beginPath();
  ctx.moveTo(hx + 70, hy + 15);
  ctx.lineTo(hx + 70, hy + 39);
  ctx.moveTo(hx + 55, hy + 27);
  ctx.lineTo(hx + 85, hy + 27);
  ctx.stroke();

  // Balconcino con gerani rossi fioriti
  ctx.fillStyle = "#5D4037";
  ctx.fillRect(hx + 50, hy + 38, 40, 6);
  ctx.fillStyle = "#E53935";
  for (let gx = hx + 52; gx < hx + 88; gx += 7) {
    ctx.beginPath();
    ctx.arc(gx, hy + 36, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Porta d'ingresso verde bosco
  ctx.fillStyle = "#2E7D32";
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(hx + 20, hy + 85, 30, 65, [12, 12, 0, 0]) : ctx.rect(hx + 20, hy + 85, 30, 65);
  ctx.fill();
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(hx + 44, hy + 118, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Festone / Bandierine colorate di festa per l'arrivo di Tatà
  const bannerColors = ["#E91E63", "#FFEB3B", "#4CAF50", "#2196F3", "#FF9800", "#9C27B0"];
  ctx.strokeStyle = "#5D4037";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(hx - 35, hy + 60);
  ctx.quadraticCurveTo(hx + 70, hy + 75, hx + 165, hy + 60);
  ctx.stroke();

  for (let f = 0; f < 8; f++) {
    const fx = hx - 25 + f * 22;
    const fy = hy + 63 + Math.sin(f * 0.8) * 4;
    ctx.fillStyle = bannerColors[f % bannerColors.length];
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + 12, fy);
    ctx.lineTo(fx + 6, fy + 12);
    ctx.closePath();
    ctx.fill();
  }

  // Staccionata in legno rustica
  ctx.strokeStyle = "#6D4C41";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(hx - 80, hy + 130);
  ctx.lineTo(hx, hy + 130);
  ctx.stroke();
  for (let px = hx - 80; px < hx; px += 18) {
    ctx.fillStyle = "#8D6E63";
    ctx.fillRect(px, hy + 115, 6, 35);
  }

  // Rastrelliera parcheggio bici pronta per la bici di Tatà!
  ctx.strokeStyle = "#78909C";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(hx - 40, hy + 150);
  ctx.lineTo(hx - 15, hy + 150);
  ctx.stroke();
  for (let rx = hx - 38; rx <= hx - 18; rx += 7) {
    ctx.beginPath();
    ctx.moveTo(rx, hy + 150);
    ctx.lineTo(rx, hy + 138);
    ctx.stroke();
  }

  ctx.restore();

  // Disegna Giulia al traguardo
  drawGiulia(giulia.x, giulia.y);
}

// ==========================================
// AGGIORNAMENTO LOGICA (LOOP)
// ==========================================

function update() {
  if (gamePaused) return;

  // 0. Controllo cutscene per Missione 2, Missione 3 e Missione 4
  if (m2Intro.active) {
    if (keys['Space'] || keys['ArrowRight'] || keys['ArrowLeft'] || keys['ArrowUp'] || keys['KeyD'] || keys['KeyA'] || keys['KeyW'] || keys['Enter']) {
      m2Intro.active = false;
      tata.x = 145;
      tata.y = 328;
      tata.facing = 1;
    }
    return;
  }
  if (m3Intro.active) {
    if (keys['Space'] || keys['ArrowRight'] || keys['ArrowLeft'] || keys['ArrowUp'] || keys['KeyD'] || keys['KeyA'] || keys['KeyW'] || keys['Enter']) {
      m3Intro.active = false;
      tata.x = 180;
      tata.y = 336;
      tata.facing = 1;
    }
    return;
  }
  if (m4Intro.active) {
    if (keys['Space'] || keys['ArrowRight'] || keys['ArrowLeft'] || keys['ArrowUp'] || keys['KeyD'] || keys['KeyA'] || keys['KeyW'] || keys['Enter']) {
      m4Intro.active = false;
      tata.x = 170;
      tata.y = 336;
      tata.facing = 1;
    }
    return;
  }
  if (m5Intro.active) {
    if (keys['Space'] || keys['ArrowRight'] || keys['ArrowLeft'] || keys['ArrowUp'] || keys['KeyD'] || keys['KeyA'] || keys['KeyW'] || keys['Enter']) {
      m5Intro.active = false;
      tata.x = 80;
      tata.y = 310;
      tata.facing = 1;
      tata.vx = 3.8;
    }
    return;
  }

  // 1. Controllo Piattaforma attuale per scivolamento e teleferica (zip-line)
  let currentPlatform = null;
  platforms.forEach(plat => {
    if (
      tata.x + tata.w > plat.x &&
      tata.x < plat.x + plat.w &&
      Math.abs((tata.y + tata.h) - plat.y) <= 6 &&
      tata.grounded
    ) {
      currentPlatform = plat;
    }
  });

  const onSlipperyPlat = currentPlatform && currentPlatform.slippery;
  const onZipline = currentPlatform && currentPlatform.zipline;
  const downPressed = keys['ArrowDown'] || keys['KeyS'];

  // Determina se è in scivolata attiva (su fango/roccia bagnata o tasto giù)
  isSliding = (onSlipperyPlat && Math.abs(tata.vx) > 0.4) || (downPressed && tata.grounded && Math.abs(tata.vx) > 0.4);

  // 2. Input orizzontale e fisica di movimento / scivolamento / teleferica / bicicletta
  if (currentMission === 5) {
    // Fisica Bicicletta in Discesa Libera (Missione 5)
    // Avanza automaticamente in discesa (facing sempre a destra = 1)
    // Frena con Sinistra / A / Giù / S; Scatta con Destra / D; Non si ferma mai del tutto
    tata.facing = 1;
    const isBraking = keys['ArrowLeft'] || keys['KeyA'] || downPressed;
    const isPedaling = keys['ArrowRight'] || keys['KeyD'];

    if (isBraking) {
      tata.vx = Math.max(1.8, tata.vx - 0.22);
      if (Math.random() < 0.22) {
        playBrakeSound();
      }
      if (tata.grounded && Math.random() < 0.35) {
        slideParticles.push({
          x: tata.x + 8,
          y: tata.y + tata.h - 2,
          vx: -(Math.random() * 2.2 + 1),
          vy: -(Math.random() * 1.5 + 0.3),
          color: "#ECEFF1",
          radius: Math.random() * 2.4 + 1.2,
          alpha: 0.75
        });
      }
    } else if (isPedaling) {
      tata.vx = Math.min(5.8, tata.vx + 0.18);
    } else {
      // Crociera naturale a 3.9 px/frame (velocità controllabile per bimbo di 6 anni)
      if (tata.vx < 3.9) tata.vx = Math.min(3.9, tata.vx + 0.1);
      else if (tata.vx > 3.9) tata.vx = Math.max(3.9, tata.vx - 0.08);
    }
  } else if (onZipline) {
    // Fisica teleferica aerea: spinta in avanti ad alta velocità con ronzio metallico
    tata.facing = 1;
    tata.vx = Math.min(7.2, Math.max(tata.vx + 0.5, 4.8));
    if (Math.random() < 0.25) {
      playZiplineSound();
    }
    if (Math.random() < 0.55) {
      slideParticles.push({
        x: tata.x + Math.random() * 20,
        y: tata.y + 6,
        vx: -(Math.random() * 3 + 2),
        vy: (Math.random() * 1.6 - 0.8),
        color: "#B2EBF2",
        radius: Math.random() * 2.8 + 1.2,
        alpha: 0.88
      });
    }
  } else {
    const maxSpeed = isSliding ? 6.2 : tata.speed;

    if (keys['ArrowRight'] || keys['KeyD']) {
      tata.facing = 1;
      if (isSliding) {
        tata.vx = Math.min(maxSpeed, tata.vx + 0.35);
      } else {
        tata.vx = tata.speed;
      }
    } else if (keys['ArrowLeft'] || keys['KeyA']) {
      tata.facing = -1;
      if (isSliding) {
        tata.vx = Math.max(-maxSpeed, tata.vx - 0.35);
      } else {
        tata.vx = -tata.speed;
      }
    } else {
      // Decelerazione
      if (onSlipperyPlat) {
        tata.vx *= 0.985;
        if (Math.abs(tata.vx) < 0.1) tata.vx = 0;
      } else if (downPressed && isSliding) {
        tata.vx *= 0.96;
        if (Math.abs(tata.vx) < 0.1) tata.vx = 0;
      } else {
        tata.vx = 0;
      }
    }
  }

  // Se sta scivolando, emetti particelle e suono
  if (isSliding && tata.grounded && Math.abs(tata.vx) > 1.2 && !onZipline && currentMission !== 5) {
    playSlideSound();
    if (Math.random() < 0.55) {
      const pColor = (currentPlatform && currentPlatform.biome === 'mud') ? "#5D4037" : "#B2EBF2";
      slideParticles.push({
        x: tata.x + (tata.facing === 1 ? 8 : tata.w - 8),
        y: tata.y + tata.h - 2,
        vx: -tata.facing * (Math.random() * 2.5 + 1.2),
        vy: -(Math.random() * 2.2 + 0.4),
        color: pColor,
        radius: Math.random() * 3.5 + 2,
        alpha: 0.85
      });
    }
  }

  // 3. Salto
  if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && tata.grounded) {
    tata.vy = tata.jumpPower;
    tata.grounded = false;
    playJumpSound();
  }

  // 4. Gravità
  tata.vy += tata.gravity;
  tata.x += tata.vx;
  tata.y += tata.vy;
  tata.grounded = false;

  // 5. Collisione con Piattaforme
  platforms.forEach(plat => {
    if (
      tata.x + tata.w > plat.x &&
      tata.x < plat.x + plat.w &&
      tata.y + tata.h >= plat.y &&
      tata.y + tata.h <= plat.y + tata.vy + 6 &&
      tata.vy >= 0
    ) {
      tata.y = plat.y - tata.h;
      tata.vy = 0;
      tata.grounded = true;
    }
  });

  // Controllo speciale rampe di lancio e salvataggio burroni per Missione 5
  if (currentMission === 5) {
    // Spinta rampa acrobatica
    if (currentPlatform && currentPlatform.ramp && tata.x + tata.w >= currentPlatform.x + currentPlatform.w - 28 && tata.grounded) {
      tata.vy = -14.4;
      tata.vx = Math.max(tata.vx, 5.2);
      tata.grounded = false;
      playJumpSound();
      spawnFloatingText("🚀 SUPER SALTO!", tata.x + 10, tata.y - 15, "#FFD700");
    }

    // Rete di salvataggio morbida nei burroni (per non bloccare mai il bimbo!)
    if (tata.y > 430) {
      tata.y = 290;
      tata.vy = -9.5;
      tata.vx = 3.8;
      playJumpSound();
      spawnFloatingText("☁️ Salvataggio Soffice!", tata.x, 300, "#00BCD4");
    }
  }

  // 6. Raccolta premi (Carote, Regali, Lamponi, More, Castagne, Moschettoni, Caschetti, Mirtilli)
  collectibles.forEach(item => {
    if (!item.collected &&
        tata.x < item.x + 22 &&
        tata.x + tata.w > item.x &&
        tata.y < item.y + 24 &&
        tata.y + tata.h > item.y) {
      item.collected = true;
      let addedPoints = 15;
      let textBadge = "+15 🥕";
      let badgeColor = "#FF7043";

      if (item.type === 'regalo') {
        addedPoints = 50;
        textBadge = "+50 🎁";
        badgeColor = "#E91E63";
      } else if (item.type === 'lampone') {
        addedPoints = 25;
        textBadge = "+25 🌸";
        badgeColor = "#E91E63";
      } else if (item.type === 'mora') {
        addedPoints = 35;
        textBadge = "+35 🫐";
        badgeColor = "#9C27B0";
      } else if (item.type === 'castagna') {
        addedPoints = 30;
        textBadge = "+30 🍂";
        badgeColor = "#D84315";
      } else if (item.type === 'moschettone') {
        addedPoints = 30;
        textBadge = "+30 🧗";
        badgeColor = "#0288D1";
      } else if (item.type === 'caschetto') {
        addedPoints = 40;
        textBadge = "+40 🪖";
        badgeColor = "#FF8F00";
      } else if (item.type === 'mirtillo') {
        addedPoints = 20;
        textBadge = "+20 🫐";
        badgeColor = "#3F51B5";
      } else if (item.type === 'campanello') {
        addedPoints = 30;
        textBadge = "+30 🔔";
        badgeColor = "#FFD700";
      } else if (item.type === 'matita') {
        addedPoints = 25;
        textBadge = "+25 ✏️";
        badgeColor = "#AB47BC";
      } else if (item.type === 'biscotto') {
        addedPoints = 35;
        textBadge = "+35 🍪";
        badgeColor = "#FF8F00";
      }

      score += addedPoints;
      spawnFloatingText(textBadge, item.x + 10, item.y - 12, badgeColor);
      playCollectSound(item.type);
    }
  });

  // 7. Nemici (Schiacciamento, Boss Orso M1, Boss Lupo M2, Boss Lontra M3, Boss Gazza M4, Boss Formaggio M5)
  if (tata.hurtTimer > 0) {
    tata.hurtTimer--;
  }

  enemies.forEach(en => {
    if (en.hitCooldown > 0) {
      en.hitCooldown--;
    }

    // Gestione animazione del nemico schiacciato
    if (en.squish > 0) {
      en.squish--;
      return;
    }
    if (!en.alive) return;

    // Ronda nemico
    en.x += en.vx;
    if (en.x < en.minX || en.x + en.w > en.maxX) {
      en.vx *= -1;
    }

    // Collisione con Tatà
    if (
      tata.x < en.x + en.w &&
      tata.x + tata.w > en.x &&
      tata.y < en.y + en.h &&
      tata.y + tata.h > en.y
    ) {
      const isStomping = tata.vy > 0 && (tata.y + tata.h) - en.y < 24;

      if (isStomping) {
        if (en.isBoss) {
          if (en.hitCooldown <= 0) {
            en.hp--;
            en.hitCooldown = 38;
            tata.vy = tata.jumpPower * 0.88; // Salto di rimbalzo

            if (en.hp > 0) {
              spawnFloatingText(`💥 -1 CUORE! (Rimasti: ${en.hp})`, en.x + en.w / 2, en.y - 20, "#FF5722");
              playSquishSound();
              if (en.type === 'lupo') playWolfSound();
              if (en.type === 'lontra') playOtterSound();
              if (en.type === 'gazza') playMagpieSound();
              if (en.type === 'formaggio_puzzolente') playCheeseSquishSound();
              en.vx = (tata.x < en.x) ? 2.4 : -2.4;
            } else {
              // Boss sconfitto!
              en.alive = false;
              en.squish = 35;
              score += en.points;

              let bossTitle = "🏆 GRANDE ORSO SCONFITTO! +100";
              if (en.type === 'lupo') bossTitle = "🏆 LUPO SCONFITTO! AVENA LIBERA! +150";
              if (en.type === 'lontra') {
                bossTitle = "🏆 FONTE LAMA BIANCA LIBERATA! +180";
                sourceWaterFlowing = true;
                boulderMoved = true;
                playWaterSplashSound();
              }
              if (en.type === 'gazza') {
                bossTitle = "🏆 GAZZA SUPERATA! BICICLETTA CONQUISTATA! +200";
                playBikeBellSound();
              }
              if (en.type === 'formaggio_puzzolente') {
                bossTitle = "🏆 GRAN FORMAGGIO SCONFITTO! +250 🧀";
                playCheeseSquishSound();
              }

              spawnFloatingText(bossTitle, en.x + en.w / 2, en.y - 25, "#FFD700");
              playCollectSound('regalo');
            }
          }
        } else {
          // Nemico normale: eliminato con un colpo
          en.alive = false;
          en.squish = 15;
          tata.vy = tata.jumpPower * 0.78;
          score += en.points;
          spawnFloatingText(`+${en.points}`, en.x + en.w / 2, en.y - 10, "#2E7D32");
          playSquishSound();
        }
      } else if (tata.hurtTimer <= 0) {
        // Scontro laterale! Danno subito
        score = Math.max(0, score - en.damage);
        tata.hurtTimer = en.isBoss ? 52 : 45;
        const pushForce = en.isBoss ? 11 : 8.5;
        tata.vx = (tata.x < en.x) ? -pushForce : pushForce;
        tata.vy = -6;
        spawnFloatingText(`-${en.damage}`, tata.x + tata.w / 2, tata.y - 12, "#D32F2F");
        playHurtSound();
      }
    }
  });

  // 8. BARRIERE DI FINE LIVELLO
  if (currentMission === 1) {
    // Barriera di Ghiaccio (Missione 1)
    const bossBear = enemies.find(e => e.type === 'orso');
    if (bossBear && bossBear.alive) {
      const barrierX = 4430;
      if (tata.x + tata.w > barrierX) {
        tata.x = barrierX - tata.w;
        tata.vx = -3.5;
        if (tata.hurtTimer <= 0) {
          spawnFloatingText("❄️ Sconfiggi l'Orso per passare da Totò!", tata.x - 30, tata.y - 18, "#00BCD4");
          tata.hurtTimer = 35;
        }
      }
    }
  } else if (currentMission === 2) {
    // Barriera di Rovi (Missione 2)
    const bossWolf = enemies.find(e => e.type === 'lupo');
    if (bossWolf && bossWolf.alive) {
      const barrierX = 4440;
      if (tata.x + tata.w > barrierX) {
        tata.x = barrierX - tata.w;
        tata.vx = -3.5;
        if (tata.hurtTimer <= 0) {
          spawnFloatingText("🐺 Il Lupo sorveglia l'Avena! Sconfiggilo!", tata.x - 30, tata.y - 18, "#D32F2F");
          tata.hurtTimer = 35;
        }
      }
    }
  } else if (currentMission === 3) {
    // Barriera del Masso e Stagno della Lontra (Missione 3)
    const bossOtter = enemies.find(e => e.type === 'lontra');
    if (bossOtter && bossOtter.alive) {
      const barrierX = 4440;
      if (tata.x + tata.w > barrierX) {
        tata.x = barrierX - tata.w;
        tata.vx = -3.5;
        if (tata.hurtTimer <= 0) {
          spawnFloatingText("🦦 La Lontra occupa la Fonte! Sconfiggila!", tata.x - 30, tata.y - 18, "#0288D1");
          tata.hurtTimer = 35;
        }
      }
    }
  } else if (currentMission === 4) {
    // Barriera del Canyon e Nido della Gazza (Missione 4)
    const bossMagpie = enemies.find(e => e.type === 'gazza' && e.isBoss);
    if (bossMagpie && bossMagpie.alive) {
      const barrierX = 4440;
      if (tata.x + tata.w > barrierX) {
        tata.x = barrierX - tata.w;
        tata.vx = -3.5;
        if (tata.hurtTimer <= 0) {
          spawnFloatingText("🦅 La Gazza fa la guardia alla Bici! Sconfiggila!", tata.x - 30, tata.y - 18, "#283593");
          tata.hurtTimer = 35;
        }
      }
    }
  } else if (currentMission === 5) {
    // Barriera del Gran Formaggio Puzzolente (Missione 5)
    const bossCheese = enemies.find(e => e.type === 'formaggio_puzzolente');
    if (bossCheese && bossCheese.alive) {
      const barrierX = 4440;
      if (tata.x + tata.w > barrierX) {
        tata.x = barrierX - tata.w;
        tata.vx = -3.5;
        if (tata.hurtTimer <= 0) {
          spawnFloatingText("🧀 Il Formaggio sbarra la strada per Giulia! Schiaccialo!", tata.x - 30, tata.y - 18, "#FFA000");
          tata.hurtTimer = 35;
        }
      }
    }
  }

  // 9. Aggiornamento testi fluttuanti
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.alpha -= 0.025;
    if (ft.alpha <= 0) {
      floatingTexts.splice(i, 1);
    }
  }

  // 10. Limiti del mondo ed estensione telecamera (4800px)
  if (tata.x < 0) tata.x = 0;
  if (tata.x > 4680) tata.x = 4680;

  cameraX = tata.x - 200;
  if (cameraX < 0) cameraX = 0;
  if (cameraX > 4000) cameraX = 4000;

  // 11. COMPLETAMENTO MISSIONE
  const finishX = (currentMission === 1) ? 4500 : (currentMission === 2 ? 4520 : (currentMission === 3 ? 4540 : 4530));
  if (tata.x >= finishX && !missionComplete) {
    missionComplete = true;
    gameWon = true;
    gamePaused = true;
    if (currentMission === 4 || currentMission === 5) {
      playBikeBellSound();
    }
    playVictoryJingle();

    setTimeout(() => {
      showMissionModal();
    }, 400);
  }
}
