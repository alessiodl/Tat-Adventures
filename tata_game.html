// Helper calcolo quota suolo per ombra di contatto
function getGroundUnder(px, py, pw) {
  let bestY = 410; // Quota base standard
  for (let i = 0; i < platforms.length; i++) {
    const p = platforms[i];
    if (px + pw > p.x && px < p.x + p.w) {
      if (p.y >= py - 8) {
        if (p.y < bestY) {
          bestY = p.y;
        }
      }
    }
  }
  return bestY;
}

// Ombra di contatto morbida semi-trasparente
function drawContactShadow(centerX, y, radiusX, radiusY, alpha = 0.25) {
  ctx.save();
  ctx.fillStyle = `rgba(18, 28, 38, ${alpha})`;
  ctx.beginPath();
  ctx.ellipse(centerX, y, radiusX, radiusY, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Rendering volumetrico e dettagliato delle piattaforme
function drawEnhancedPlatform(plat) {
  const x = plat.x;
  const y = plat.y;
  const w = plat.w;
  const h = plat.h;

  ctx.save();

  if (plat.biome === 'snow') {
    // Base roccia alpina con gradiente di profondità
    const rockGrad = ctx.createLinearGradient(x, y, x, y + h);
    rockGrad.addColorStop(0, "#607D8B");
    rockGrad.addColorStop(1, "#37474F");
    ctx.fillStyle = rockGrad;
    ctx.fillRect(x, y, w, h);

    // Bordo d'ombra laterale
    ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
    ctx.fillRect(x + w - 3, y, 3, h);

    // Manto di neve soffice superiore con cuscinetti morbidi
    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.roundRect(x - 1, y - 2, w + 2, 10, [4, 4, 2, 2]);
    ctx.fill();

    // Sfumatura ghiaccio celeste
    ctx.fillStyle = "#B2EBF2";
    ctx.fillRect(x, y + 8, w, 2.5);

    // Piccoli ghiaccioli stilizzati sotto il manto di neve
    ctx.fillStyle = "#E0F7FA";
    for (let ix = x + 16; ix < x + w - 10; ix += 32) {
      ctx.beginPath();
      ctx.moveTo(ix, y + 10);
      ctx.lineTo(ix + 4, y + 15);
      ctx.lineTo(ix + 8, y + 10);
      ctx.fill();
    }
  } else if (plat.biome === 'wetrock') {
    // Roccia fluviale bagnata e levigata
    const rockGrad = ctx.createLinearGradient(x, y, x, y + h);
    rockGrad.addColorStop(0, "#455A64");
    rockGrad.addColorStop(1, "#263238");
    ctx.fillStyle = rockGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.fill();

    // Bagliore d'acqua lucida (specular sheen)
    const sheenGrad = ctx.createLinearGradient(x, y, x, y + 6);
    sheenGrad.addColorStop(0, "rgba(255, 255, 255, 0.65)");
    sheenGrad.addColorStop(0.5, "rgba(178, 235, 242, 0.4)");
    sheenGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.fillStyle = sheenGrad;
    ctx.fillRect(x + 2, y, w - 4, 6);

    // Macchie di muschio morbido e vivace
    ctx.fillStyle = "#43A047";
    ctx.beginPath();
    ctx.ellipse(x + 18, y + 4, 14, 3.5, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 75, y + 4, 20, 4, 0, 0, Math.PI * 2);
    if (w > 150) ctx.ellipse(x + 140, y + 4, 18, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#66BB6A";
    ctx.beginPath();
    ctx.ellipse(x + 16, y + 3, 8, 2, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 73, y + 3, 12, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (plat.biome === 'mud') {
    // Pozza di fango denso e scivoloso
    const mudGrad = ctx.createLinearGradient(x, y, x, y + h);
    mudGrad.addColorStop(0, "#6D4C41");
    mudGrad.addColorStop(1, "#3E2723");
    ctx.fillStyle = mudGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, [0, 0, 6, 6]);
    ctx.fill();

    // Riflesso viscido d'acqua sulla superficie
    ctx.fillStyle = "rgba(215, 204, 200, 0.35)";
    ctx.fillRect(x + 4, y, w - 8, 2.5);

    // Pozzette e foglioline nel fango
    ctx.fillStyle = "#FFA000";
    for (let fx = x + 25; fx < x + w - 15; fx += 70) {
      ctx.beginPath();
      ctx.ellipse(fx, y + 3.5, 6, 3, 0.25, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (plat.biome === 'stone') {
    // Lastra di pietra calcarea della Majella
    const stoneGrad = ctx.createLinearGradient(x, y, x, y + h);
    stoneGrad.addColorStop(0, "#90A4AE");
    stoneGrad.addColorStop(1, "#546E7A");
    ctx.fillStyle = stoneGrad;
    ctx.fillRect(x, y, w, h);

    // Bevel superiore luminoso
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    ctx.fillRect(x, y, w, 2.5);

    // Ombreggiatura blocchi di pietra
    ctx.strokeStyle = "rgba(38, 50, 56, 0.35)";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x, y, w, h);
    for (let bx = x + 40; bx < x + w - 10; bx += 40) {
      ctx.beginPath();
      ctx.moveTo(bx, y);
      ctx.lineTo(bx, y + h);
      ctx.stroke();
    }
  } else if (plat.biome === 'autumn_log' || plat.biome === 'autumn_forest') {
    // Tronco e faggi autunnali
    const barkGrad = ctx.createLinearGradient(x, y, x, y + h);
    barkGrad.addColorStop(0, "#6D4C41");
    barkGrad.addColorStop(1, "#3E2723");
    ctx.fillStyle = barkGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.fill();

    // Bordo con foglie autunnali sovrapposte
    const leafGrad = ctx.createLinearGradient(x, y, x, y + 8);
    leafGrad.addColorStop(0, "#FFB300");
    leafGrad.addColorStop(1, "#D84315");
    ctx.fillStyle = leafGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, 8, [4, 4, 0, 0]);
    ctx.fill();

    // Foglie sparse
    ctx.fillStyle = "#FF7043";
    for (let lx = x + 12; lx < x + w - 10; lx += 38) {
      ctx.beginPath();
      ctx.ellipse(lx, y + 3, 5, 2.5, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (plat.biome === 'autumn_grass') {
    // Prato autunnale con cumuli di foglie ramate
    const earthGrad = ctx.createLinearGradient(x, y, x, y + h);
    earthGrad.addColorStop(0, "#5D4037");
    earthGrad.addColorStop(1, "#3E2723");
    ctx.fillStyle = earthGrad;
    ctx.fillRect(x, y, w, h);

    // Manto superiore arancio-ruggine
    const topGrad = ctx.createLinearGradient(x, y, x, y + 9);
    topGrad.addColorStop(0, "#E65100");
    topGrad.addColorStop(1, "#BF360C");
    ctx.fillStyle = topGrad;
    ctx.fillRect(x, y, w, 9);

    // Ciuffi d'erba secca e foglie a terra
    ctx.fillStyle = "#FFB300";
    for (let fx = x + 15; fx < x + w - 10; fx += 45) {
      ctx.beginPath();
      ctx.ellipse(fx, y + 3, 7, 3, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(fx - 2, y - 2, 2, 3);
      ctx.fillRect(fx + 2, y - 3, 2, 4);
    }
  } else if (plat.biome === 'wood') {
    // Tavole di legno montano
    const woodGrad = ctx.createLinearGradient(x, y, x, y + h);
    woodGrad.addColorStop(0, "#A1887F");
    woodGrad.addColorStop(1, "#6D4C41");
    ctx.fillStyle = woodGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 3);
    ctx.fill();

    // Doghe di legno verticali e chiodini dorati
    ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
    ctx.fillRect(x, y, w, 2);

    ctx.strokeStyle = "rgba(62, 39, 35, 0.4)";
    ctx.lineWidth = 1;
    for (let wx = x + 35; wx < x + w - 10; wx += 35) {
      ctx.beginPath();
      ctx.moveTo(wx, y);
      ctx.lineTo(wx, y + h);
      ctx.stroke();
      ctx.fillStyle = "#3E2723";
      ctx.fillRect(wx - 3, y + 4, 2, 2);
      ctx.fillRect(wx - 3, y + h - 5, 2, 2);
    }
  } else if (plat.biome === 'forest' || plat.biome === 'log') {
    // Tronco e muschio di bosco
    const woodGrad = ctx.createLinearGradient(x, y, x, y + h);
    woodGrad.addColorStop(0, "#4E342E");
    woodGrad.addColorStop(1, "#271B16");
    ctx.fillStyle = woodGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 4);
    ctx.fill();

    // Manto di muschio verde smeraldo
    const mossGrad = ctx.createLinearGradient(x, y, x, y + 9);
    mossGrad.addColorStop(0, "#66BB6A");
    mossGrad.addColorStop(1, "#2E7D32");
    ctx.fillStyle = mossGrad;
    ctx.beginPath();
    ctx.roundRect(x, y, w, 9, [4, 4, 0, 0]);
    ctx.fill();

    // Ondine di muschio sul bordo inferiore
    ctx.fillStyle = "#2E7D32";
    for (let mx = x + 8; mx < x + w - 6; mx += 14) {
      ctx.beginPath();
      ctx.arc(mx, y + 9, 3, 0, Math.PI);
      ctx.fill();
    }
  } else if (plat.biome === 'village_stone') {
    // Pavimentazione in ciottoli e lastricato medievale del borgo di Sant'Eufemia
    const stoneGrad = ctx.createLinearGradient(x, y, x, y + h);
    stoneGrad.addColorStop(0, "#CFD8DC");
    stoneGrad.addColorStop(1, "#90A4AE");
    ctx.fillStyle = stoneGrad;
    ctx.fillRect(x, y, w, h);

    // Bevel superiore luminoso
    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
    ctx.fillRect(x, y, w, 2.5);

    // Ciottoli arrotondati e fughe in malta antica
    ctx.strokeStyle = "rgba(55, 71, 79, 0.35)";
    ctx.lineWidth = 1.2;
    for (let py = y + 7; py < y + h; py += 12) {
      const rowOffset = (Math.floor(py / 12) % 2) * 12;
      for (let px = x + rowOffset; px < x + w; px += 24) {
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(px + 2, py - 4, 20, 9, 3) : ctx.rect(px + 2, py - 4, 20, 9);
        ctx.stroke();
      }
    }
  } else if (plat.biome === 'rope_bridge') {
    // Ponte tibetano sospeso nel vuoto
    // Funi portanti principali superiore e inferiore
    ctx.strokeStyle = "#8D6E63";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y - 14);
    ctx.quadraticCurveTo(x + w / 2, y - 8, x + w, y - 14);
    ctx.stroke();

    ctx.strokeStyle = "#5D4037";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.quadraticCurveTo(x + w / 2, y + h + 4, x + w, y + h);
    ctx.stroke();

    // Tavole di legno calpestabili distanziate
    for (let bx = x + 6; bx < x + w - 6; bx += 18) {
      // Corda verticale di sospensione
      ctx.strokeStyle = "rgba(141, 110, 99, 0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(bx + 5, y - 12);
      ctx.lineTo(bx + 5, y + h);
      ctx.stroke();

      // Asse di legno
      const plankGrad = ctx.createLinearGradient(bx, y, bx + 10, y + h);
      plankGrad.addColorStop(0, "#D7CCC8");
      plankGrad.addColorStop(1, "#8D6E63");
      ctx.fillStyle = plankGrad;
      ctx.fillRect(bx, y, 11, h);
      ctx.strokeStyle = "#4E342E";
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, y, 11, h);
    }
  } else if (plat.biome === 'zipline') {
    // Teleferica zip-line ad alta velocità con cavo d'acciaio lucido
    // Fune d'acciaio con pendenza
    ctx.strokeStyle = "#37474F";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x, y + 2);
    ctx.lineTo(x + w, y + h - 2);
    ctx.stroke();

    // Bagliore lucido del cavo metallico
    ctx.strokeStyle = "#ECEFF1";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y + h - 4);
    ctx.stroke();

    // Carrucola / carrello metallico scorrevole con rotelle
    const pulleyTime = (Date.now() * 0.003) % 1;
    const pulX = x + 30 + pulleyTime * (w - 70);
    const pulY = y + 2 + pulleyTime * (h - 4);

    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.arc(pulX, pulY - 7, 5, 0, Math.PI * 2);
    ctx.arc(pulX + 10, pulY - 7, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#455A64";
    ctx.fillRect(pulX - 2, pulY - 4, 14, 7);

    // Strisce segnaletiche giallo/nere di sicurezza alle estremità
    for (let sx = x; sx < x + 16; sx += 6) {
      ctx.fillStyle = (Math.floor(sx / 6) % 2 === 0) ? "#FFD600" : "#212121";
      ctx.fillRect(sx, y - 4, 5, h + 8);
    }
    for (let sx = x + w - 16; sx < x + w; sx += 6) {
      ctx.fillStyle = (Math.floor(sx / 6) % 2 === 0) ? "#FFD600" : "#212121";
      ctx.fillRect(sx, y - 4, 5, h + 8);
    }
  } else if (plat.biome === 'suspended_ladder') {
    // Scala di corda sospesa con pioli in legno
    ctx.strokeStyle = "#8D6E63";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x + 4, y - 2);
    ctx.lineTo(x + 4, y + h + 2);
    ctx.moveTo(x + w - 4, y - 2);
    ctx.lineTo(x + w - 4, y + h + 2);
    ctx.stroke();

    // Pioli in legno
    for (let ly = y + 4; ly < y + h; ly += 14) {
      ctx.fillStyle = "#D7CCC8";
      ctx.fillRect(x + 2, ly, w - 4, 5);
      ctx.strokeStyle = "#5D4037";
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2, ly, w - 4, 5);
    }

    // Moschettoni d'ancoraggio in cima
    ctx.strokeStyle = "#FF8F00";
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 2, y - 8, 5, 7);
    ctx.strokeRect(x + w - 7, y - 8, 5, 7);
  } else if (plat.biome === 'cargo_net') {
    // Rete d'arrampicata a maglie con nodi marinari
    ctx.fillStyle = "rgba(46, 125, 50, 0.15)";
    ctx.fillRect(x, y, w, h);

    // Funi orizzontali e verticali incrociate
    ctx.strokeStyle = "#A1887F";
    ctx.lineWidth = 2;
    for (let rx = x + 10; rx < x + w; rx += 16) {
      ctx.beginPath();
      ctx.moveTo(rx, y);
      ctx.lineTo(rx, y + h);
      ctx.stroke();
    }
    for (let ry = y + 8; ry < y + h; ry += 12) {
      ctx.beginPath();
      ctx.moveTo(x, ry);
      ctx.lineTo(x + w, ry);
      ctx.stroke();
    }

    // Nodi alle intersezioni
    ctx.fillStyle = "#6D4C41";
    for (let rx = x + 10; rx < x + w; rx += 16) {
      for (let ry = y + 8; ry < y + h; ry += 12) {
        ctx.beginPath();
        ctx.arc(rx, ry, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (plat.biome === 'treetop') {
    // Piattaforma aerea su albero in legno massello con parapetto
    const woodGrad = ctx.createLinearGradient(x, y, x, y + h);
    woodGrad.addColorStop(0, "#8D6E63");
    woodGrad.addColorStop(1, "#4E342E");
    ctx.fillStyle = woodGrad;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, w, h, 4) : ctx.rect(x, y, w, h);
    ctx.fill();

    // Travi portanti sottostanti
    ctx.fillStyle = "#3E2723";
    ctx.fillRect(x + 8, y + h, 14, 18);
    ctx.fillRect(x + w - 22, y + h, 14, 18);

    // Corde di sicurezza avvolte
    ctx.strokeStyle = "#FFB300";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + 5, y + 2);
    ctx.lineTo(x + 5, y + h - 2);
    ctx.moveTo(x + w - 5, y + 2);
    ctx.lineTo(x + w - 5, y + h - 2);
    ctx.stroke();
  } else if (plat.biome === 'mountain_road') {
    // Strada asfaltata di montagna con linea di mezzeria e cordoli in pietra
    const roadGrad = ctx.createLinearGradient(x, y, x, y + h);
    roadGrad.addColorStop(0, "#455A64");
    roadGrad.addColorStop(1, "#263238");
    ctx.fillStyle = roadGrad;
    ctx.fillRect(x, y, w, h);

    // Cordolo superiore in granito alpino
    ctx.fillStyle = "#90A4AE";
    ctx.fillRect(x, y, w, 3.5);

    // Bordo d'ombra
    ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
    ctx.fillRect(x, y + 3.5, w, 2);

    // Linea di mezzeria tratteggiata bianca per biciclette
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    for (let lx = x + 10; lx < x + w - 10; lx += 36) {
      ctx.fillRect(lx, y + 14, 20, 2.5);
    }

    // Parapetto di protezione in legno con catarifrangenti rossi
    for (let px = x + 24; px < x + w - 15; px += 80) {
      // Palo verticale
      ctx.fillStyle = "#5D4037";
      ctx.fillRect(px, y - 10, 6, 12);
      // Catarifrangente rosso
      ctx.fillStyle = "#FF1744";
      ctx.fillRect(px + 1.5, y - 8, 3, 3);
    }
    // Traversa orizzontale del guard-rail
    ctx.fillStyle = "#8D6E63";
    ctx.fillRect(x, y - 9, w, 3);
  } else if (plat.biome === 'ramp') {
    // Rampa di lancio acrobatica per salti spettacolari
    const rampGrad = ctx.createLinearGradient(x, y, x + w, y + h);
    rampGrad.addColorStop(0, "#D7CCC8");
    rampGrad.addColorStop(1, "#6D4C41");
    ctx.fillStyle = rampGrad;

    // Struttura triangolare a cuneo che si alza verso destra
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x, y + 12);
    ctx.lineTo(x + w, y);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#3E2723";
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Travi diagonali di rinforzo in legno sotto la rampa
    ctx.strokeStyle = "rgba(62, 39, 35, 0.6)";
    ctx.lineWidth = 2;
    for (let rx = x + 20; rx < x + w - 10; rx += 30) {
      ctx.beginPath();
      ctx.moveTo(rx, y + h);
      ctx.lineTo(rx + 15, y + 4);
      ctx.stroke();
    }

    // Banda a strisce giallo/nere da brivido sul labbro di lancio (kicker)
    for (let sx = x + w - 30; sx < x + w; sx += 6) {
      ctx.fillStyle = (Math.floor(sx / 6) % 2 === 0) ? "#FFD600" : "#212121";
      ctx.fillRect(sx, y - 2, 5, 6);
    }

    // Frecce dinamiche di lancio ">>"
    ctx.fillStyle = "#FFFFFF";
    ctx.font = "bold 11px sans-serif";
    ctx.fillText(">>", x + w / 2 - 8, y + 15);
  } else if (plat.biome === 'mountain_bridge') {
    // Ponte/Viadotto panoramico in pietra e assi di legno su burrone
    // Base in muratura di pietra
    const stoneGrad = ctx.createLinearGradient(x, y, x, y + h);
    stoneGrad.addColorStop(0, "#78909C");
    stoneGrad.addColorStop(1, "#37474F");
    ctx.fillStyle = stoneGrad;
    ctx.fillRect(x, y, w, h);

    // Arcate del viadotto
    ctx.fillStyle = "rgba(18, 28, 38, 0.45)";
    for (let ax = x + 15; ax < x + w - 20; ax += 45) {
      ctx.beginPath();
      ctx.arc(ax + 15, y + h, 14, Math.PI, 0);
      ctx.fill();
    }

    // Assi di legno calpestabili in superficie
    ctx.fillStyle = "#8D6E63";
    ctx.fillRect(x, y, w, 5);
    ctx.strokeStyle = "#4E342E";
    ctx.lineWidth = 1;
    for (let bx = x + 10; bx < x + w; bx += 14) {
      ctx.beginPath();
      ctx.moveTo(bx, y);
      ctx.lineTo(bx, y + 5);
      ctx.stroke();
    }

    // Ringhiera in ferro battuto del viadotto
    ctx.strokeStyle = "#263238";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y - 10);
    ctx.lineTo(x + w, y - 10);
    ctx.stroke();
    for (let rx = x + 8; rx < x + w; rx += 18) {
      ctx.beginPath();
      ctx.moveTo(rx, y - 10);
      ctx.lineTo(rx, y);
      ctx.stroke();
    }
  } else {
    // Prato verde e terra viva (standard / campagna)
    const dirtGrad = ctx.createLinearGradient(x, y, x, y + h);
    dirtGrad.addColorStop(0, "#795548");
    dirtGrad.addColorStop(1, "#4E342E");
    ctx.fillStyle = dirtGrad;
    ctx.fillRect(x, y, w, h);

    // Manto d'erba fresca brillante
    const grassGrad = ctx.createLinearGradient(x, y, x, y + 9);
    grassGrad.addColorStop(0, "#66BB6A");
    grassGrad.addColorStop(1, "#388E3C");
    ctx.fillStyle = grassGrad;
    ctx.fillRect(x, y, w, 9);

    // Luce sul bordo superiore
    ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
    ctx.fillRect(x, y, w, 1.8);

    // Ciuffetti d'erbetta fresca
    ctx.fillStyle = "#66BB6A";
    for (let gx = x + 6; gx < x + w - 4; gx += 12) {
      ctx.beginPath();
      ctx.moveTo(gx, y);
      ctx.lineTo(gx + 2, y - 3);
      ctx.lineTo(gx + 4, y);
      ctx.fill();
    }

    // Ondine erbose alla base del manto
    ctx.fillStyle = "#388E3C";
    for (let gx = x + 8; gx < x + w - 6; gx += 16) {
      ctx.beginPath();
      ctx.arc(gx, y + 9, 2.5, 0, Math.PI);
      ctx.fill();
    }
  }

  ctx.restore();
}

// Sole e bagliore atmosferico nel cielo
function drawSunOrSkyGlow(camX) {
  ctx.save();
  if (currentMission === 1) {
    const sunX = 710 - camX * 0.02;
    const sunY = 70;
    // Aura esterna
    const glow = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 70);
    glow.addColorStop(0, "rgba(255, 241, 118, 0.45)");
    glow.addColorStop(0.6, "rgba(255, 213, 79, 0.18)");
    glow.addColorStop(1, "rgba(255, 238, 88, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 70, 0, Math.PI * 2);
    ctx.fill();

    // Disco solare caldo
    const sunGrad = ctx.createRadialGradient(sunX - 5, sunY - 5, 2, sunX, sunY, 26);
    sunGrad.addColorStop(0, "#FFF9C4");
    sunGrad.addColorStop(0.7, "#FFEE58");
    sunGrad.addColorStop(1, "#FDD835");
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
    ctx.fill();

    // Raggiettini solari morbidi
    ctx.strokeStyle = "rgba(255, 238, 88, 0.4)";
    ctx.lineWidth = 2.5;
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
      const rx1 = sunX + Math.cos(a) * 32;
      const ry1 = sunY + Math.sin(a) * 32;
      const rx2 = sunX + Math.cos(a) * 44;
      const ry2 = sunY + Math.sin(a) * 44;
      ctx.beginPath();
      ctx.moveTo(rx1, ry1);
      ctx.lineTo(rx2, ry2);
      ctx.stroke();
    }
  } else if (currentMission === 3) {
    // Tramonto d'autunno caldo sulla Majella
    const sunX = 660 - camX * 0.02;
    const sunY = 85;
    const sunsetGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 120);
    sunsetGlow.addColorStop(0, "rgba(255, 183, 77, 0.5)");
    sunsetGlow.addColorStop(0.5, "rgba(255, 112, 67, 0.2)");
    sunsetGlow.addColorStop(1, "rgba(255, 87, 34, 0)");
    ctx.fillStyle = sunsetGlow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 120, 0, Math.PI * 2);
    ctx.fill();

    const sunGrad = ctx.createRadialGradient(sunX - 4, sunY - 4, 3, sunX, sunY, 28);
    sunGrad.addColorStop(0, "#FFE0B2");
    sunGrad.addColorStop(0.7, "#FFA726");
    sunGrad.addColorStop(1, "#FB8C00");
    ctx.fillStyle = sunGrad;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 28, 0, Math.PI * 2);
    ctx.fill();
  } else if (currentMission === 4) {
    // Sole alpino d'alta quota brillante tra le vette di Bocca di Valle
    const sunX = 690 - camX * 0.02;
    const sunY = 75;
    const glow = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 85);
    glow.addColorStop(0, "rgba(255, 245, 157, 0.55)");
    glow.addColorStop(0.6, "rgba(255, 238, 88, 0.22)");
    glow.addColorStop(1, "rgba(255, 238, 88, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 85, 0, Math.PI * 2);
    ctx.fill();

    const sunGrad = ctx.createRadialGradient(sunX - 4, sunY - 4, 3, sunX, sunY, 26);
    sunGrad.addColorStop(0, "#FFFFFF");
    sunGrad.addColorStop(0.6, "#FFEE58");
    sunGrad.addColorStop(1, "#FDD835");
    ctx.fillStyle = sunGrad;
    ctx.beginPath();

}

// Particelle d'atmosfera (pulviscolo, lucciole e faville dorate)
const ambientParticles = [];
for (let i = 0; i < 28; i++) {
  ambientParticles.push({
    x: Math.random() * 800,
    y: Math.random() * 450,
    size: 1.2 + Math.random() * 2.2,
    vx: 0.15 + Math.random() * 0.35,
    vy: -0.15 - Math.random() * 0.25,
    seed: Math.random() * 100,
    baseAlpha: 0.25 + Math.random() * 0.45
  });
}

function updateAndDrawAmbientParticles() {
  ctx.save();
  const time = Date.now() * 0.0015;
  ambientParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy + Math.sin(time + p.seed) * 0.25;
    if (p.x > 800) p.x = 0;
    if (p.x < 0) p.x = 800;
    if (p.y < 0) p.y = 450;
    if (p.y > 450) p.y = 0;

    const pulse = 0.5 + 0.5 * Math.sin(time * 2 + p.seed);
    const alpha = p.baseAlpha * pulse;

    if (currentMission === 1) {
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.85})`;
    } else if (currentMission === 2) {
      ctx.fillStyle = `rgba(180, 255, 120, ${alpha * 0.3})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(235, 255, 190, ${alpha})`;
    } else if (currentMission === 3) {
      ctx.fillStyle = `rgba(255, 180, 80, ${alpha * 0.3})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255, 235, 160, ${alpha})`;
    } else {
      // Faville e aghi di pino fluttuanti nell'aria fresca alpina
      ctx.fillStyle = `rgba(129, 212, 250, ${alpha * 0.35})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

// Raggi di sole volumetrici (God Rays)
function drawGodRays(camX) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const time = Date.now() * 0.0007;

  if (currentMission === 1) {
    const grad = ctx.createLinearGradient(0, 0, 450, 450);
    const pulse = 0.035 + Math.sin(time) * 0.015;
    grad.addColorStop(0, `rgba(255, 248, 220, ${pulse * 1.6})`);
    grad.addColorStop(0.6, `rgba(255, 235, 180, ${pulse * 0.6})`);
    grad.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 450);
  } else if (currentMission === 2) {
    const rays = [
      { x: 140, w: 85 },
      { x: 360, w: 105 },
      { x: 590, w: 95 }
    ];
    rays.forEach((r, i) => {
      const rayShift = Math.sin(time * 0.9 + i * 1.8) * 18;
      const startX = r.x + rayShift;
      const grad = ctx.createLinearGradient(startX, 0, startX + 200, 450);
      const pulse = 0.05 + Math.sin(time + i * 1.5) * 0.02;
      grad.addColorStop(0, `rgba(215, 255, 205, ${pulse})`);
      grad.addColorStop(0.65, `rgba(180, 240, 170, ${pulse * 0.45})`);
      grad.addColorStop(1, "rgba(255, 255, 255, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(startX, 0);
      ctx.lineTo(startX + r.w, 0);
      ctx.lineTo(startX + r.w + 200, 450);
      ctx.lineTo(startX + 160, 450);
      ctx.closePath();
      ctx.fill();
    });
  } else if (currentMission === 3) {
    const rays = [
      { x: 100, w: 90 },
      { x: 320, w: 120 },
      { x: 570, w: 110 }
    ];
    rays.forEach((r, i) => {
      const rayShift = Math.sin(time * 0.7 + i * 1.5) * 20;
      const startX = r.x + rayShift;
      const grad = ctx.createLinearGradient(startX, 0, startX + 180, 450);
      const pulse = 0.06 + Math.sin(time * 1.1 + i * 2) * 0.022;
      grad.addColorStop(0, `rgba(255, 220, 140, ${pulse})`);
      grad.addColorStop(0.65, `rgba(255, 160, 75, ${pulse * 0.5})`);
      grad.addColorStop(1, "rgba(255, 200, 100, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(startX, 0);
      ctx.lineTo(startX + r.w, 0);
      ctx.lineTo(startX + r.w + 180, 450);
      ctx.lineTo(startX + 140, 450);
      ctx.closePath();
      ctx.fill();
    });
  } else {
    // Raggi filtrati tra i pini e le piattaforme aeree di Bocca di Valle
    const rays = [
      { x: 120, w: 90 },
      { x: 380, w: 115 },
      { x: 620, w: 95 }
    ];
    rays.forEach((r, i) => {
      const rayShift = Math.sin(time * 0.8 + i * 1.6) * 18;
      const startX = r.x + rayShift;
      const grad = ctx.createLinearGradient(startX, 0, startX + 170, 450);
      const pulse = 0.05 + Math.sin(time + i * 1.8) * 0.02;
      grad.addColorStop(0, `rgba(225, 245, 254, ${pulse * 1.2})`);
      grad.addColorStop(0.65, `rgba(178, 235, 242, ${pulse * 0.5})`);
      grad.addColorStop(1, "rgba(255, 255, 255, 0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(startX, 0);
      ctx.lineTo(startX + r.w, 0);
      ctx.lineTo(startX + r.w + 170, 450);
      ctx.lineTo(startX + 130, 450);
      ctx.closePath();
      ctx.fill();
    });
  }
  ctx.restore();
}

// ==========================================
// LOOP PRINCIPALE DI DISEGNO (DRAW)
// ==========================================

function draw() {
  ctx.save();
  ctx.setTransform(DPR * SCALE_25, 0, 0, DPR * SCALE_25, 0, 0);
  ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

  // 1. Sole caldo e Nuvole soffici animate
  drawSunOrSkyGlow(cameraX);
  drawClouds(cameraX);

  // 2. Sfondi Parallasse in base alla Missione attiva
  if (currentMission === 1) {
    drawSnowyMountains(cameraX);
    drawFarHills(cameraX);
  } else if (currentMission === 2) {
    drawIntrodacquaMountains(cameraX);
    drawIntrodacquaForestHills(cameraX);
  } else if (currentMission === 3) {
    drawMajellaAutumnMountains(cameraX);
    drawAutumnBeechForest(cameraX);
  } else if (currentMission === 4) {
    drawBoccaDiValleMountains(cameraX);
    drawBoccaDiValleForestHills(cameraX);
  } else {
    drawHighMountainPass(cameraX);
    drawDownhillPineHills(cameraX);
  }

  // 3. MONDO DI GIOCO REALE (Velocità 1.0)
  ctx.save();
  ctx.translate(-cameraX, 0);

  // Scenografia specifica della missione
  if (currentMission === 1) {
    drawWorldScenery();
  } else if (currentMission === 2) {
    drawIntrodacquaScenery();
  } else if (currentMission === 3) {
    drawAutumnScenery();
  } else if (currentMission === 4) {
    drawBoccaDiValleScenery();
  } else {
    drawDownhillScenery();
  }

  // Disegna piattaforme con texture tridimensionale
  platforms.forEach(drawEnhancedPlatform);

  // Disegna particelle di scivolamento
  drawSlideParticles();

  // Disegna collezionabili con ombra di contatto
  collectibles.forEach(item => {
    if (!item.collected) {
      const groundY = getGroundUnder(item.x, item.y + 20, 20);
      const dist = Math.max(0, groundY - (item.y + 20));
      const scale = Math.max(0.4, 1 - dist / 150);
      drawContactShadow(item.x + 10, groundY, 10 * scale, 3.5 * scale, 0.22 * scale);

      if (item.type === 'carota') drawCarrot(item.x, item.y);
      else if (item.type === 'regalo') drawGift(item.x, item.y);
      else if (item.type === 'lampone') drawRaspberry(item.x, item.y);
      else if (item.type === 'mora') drawBlackberry(item.x, item.y);
      else if (item.type === 'castagna') drawChestnut(item.x, item.y);
      else if (item.type === 'moschettone') drawCarabiner(item.x, item.y);
      else if (item.type === 'caschetto') drawHelmet(item.x, item.y);
      else if (item.type === 'mirtillo') drawBlueberry(item.x, item.y);
      else if (item.type === 'campanello') drawBikeBellCollectible(item.x, item.y);
      else if (item.type === 'matita') drawPencilCollectible(item.x, item.y);
      else if (item.type === 'biscotto') drawCookieCollectible(item.x, item.y);
    }
  });

  // Disegna nemici con ombra di contatto
  enemies.forEach(en => {
    if (en.alive) {
      const enGroundY = getGroundUnder(en.x, en.y + en.h, en.w);
      const enDist = Math.max(0, enGroundY - (en.y + en.h));
      const enScale = Math.max(0.45, 1 - enDist / 200);
      drawContactShadow(en.x + en.w / 2, enGroundY, (en.w / 2) * enScale, 4.5 * enScale, 0.25 * enScale);
    }
    drawEnemy(en);
  });

  // Disegna cutscene iniziali se attive oppure il giocatore con la sua ombra di contatto
  if (currentMission === 2 && m2Intro.active) {
    updateAndDrawM2Intro();
  } else if (currentMission === 3 && m3Intro.active) {
    updateAndDrawM3Intro();
  } else if (currentMission === 4 && m4Intro.active) {
    updateAndDrawM4Intro();
  } else if (currentMission === 5 && m5Intro.active) {
    updateAndDrawM5Intro();
  } else {
    // Ombra del giocatore sul terreno
    if (currentMission === 2) {
      const groundY = getGroundUnder(tata.x, tata.y + tata.h, 60);
      const dist = Math.max(0, groundY - (tata.y + tata.h));
      const scale = Math.max(0.45, 1 - dist / 220);
      drawContactShadow(tata.x + 30, groundY, 30 * scale, 7.5 * scale, 0.3 * scale);
      drawMulanWithTata(tata.x, tata.y, tata.facing);
    } else if (currentMission === 5) {
      const groundY = getGroundUnder(tata.x, tata.y + tata.h, 56);
      const dist = Math.max(0, groundY - (tata.y + tata.h));
      const scale = Math.max(0.45, 1 - dist / 220);
      drawContactShadow(tata.x + 28, groundY, 28 * scale, 6.5 * scale, 0.32 * scale);
      const downPressed = keys['ArrowDown'] || keys['KeyS'];
      const isBraking = keys['ArrowLeft'] || keys['KeyA'] || downPressed;
      drawTataOnBicycle(tata.x, tata.y, 1, isBraking);
    } else {
      const groundY = getGroundUnder(tata.x, tata.y + tata.h, tata.w);
      const dist = Math.max(0, groundY - (tata.y + tata.h));
      const scale = Math.max(0.45, 1 - dist / 200);
      drawContactShadow(tata.x + tata.w / 2, groundY, 14 * scale, 4.5 * scale, 0.3 * scale);
      drawTata(tata.x, tata.y, tata.facing);
    }
  }

  // Disegna testi fluttuanti (+punti / -punti)
  floatingTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.fillStyle = ft.color;
    ctx.font = "bold 20px 'Comic Sans MS', sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.35)";
    ctx.shadowBlur = 4;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });

  // In Missione 3 disegna le foglie autunnali cadenti
  if (currentMission === 3) {
    drawAutumnLeaves();
  }

  ctx.restore(); // Fine coordinate mondo reale (cameraX)

  // 4. Effetti Atmosferici Post-Processing (God Rays, Particelle Ambientali, Vignetta)
  drawGodRays(cameraX);
  updateAndDrawAmbientParticles();
  drawVignette();

  // 5. Interfaccia HUD Moderna Glassmorphic
  drawModernHUD();

  ctx.restore(); // Fine frame DPR
}

// ==========================================
// GAME LOOP PRINCIPALE
// ==========================================

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Avvio iniziale con la Missione 1
initMission(1);
loop();
</script>
</body>
</html>
