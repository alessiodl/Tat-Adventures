<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Le Avventure di Tatà</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 8px;
      background: #87CEEB; /* Cielo azzurro */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    .game-wrapper {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
    }
    canvas {
      width: 100%;
      max-width: 1000px;
      height: auto;
      aspect-ratio: 1000 / 562;
      border: 4px solid rgba(255, 255, 255, 0.95);
      outline: 4px solid #4CAF50;
      border-radius: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22), 0 3px 10px rgba(0, 0, 0, 0.1);
      background: linear-gradient(to bottom, #87CEEB 65%, #B0E0E6 100%);
      image-rendering: -webkit-optimize-contrast;
      display: block;
      touch-action: none;
    }
    .top-bar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .top-bar-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .game-title {
      font-size: 19px;
      font-weight: bold;
      color: #1b5e20;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.7);
    }
    /* Touch Controls per Tablet / Mobile */
    .touch-controls {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 4px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .touch-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .touch-btn {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
      border: 3px solid rgba(255, 255, 255, 0.92);
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.16), inset 0 2px 3px rgba(255, 255, 255, 0.6);
      font-family: inherit;
      font-weight: bold;
      transition: transform 0.08s ease, filter 0.08s ease, box-shadow 0.08s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active, .touch-btn.touch-active {
      transform: scale(0.92);
      filter: brightness(1.15);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25), inset 0 2px 5px rgba(0, 0, 0, 0.2), 0 0 14px rgba(255, 215, 0, 0.7);
    }
    .touch-btn-dir {
      width: 68px;
      height: 64px;
      background: linear-gradient(135deg, #FFFFFF, #E8F5E9);
      color: #2E7D32;
    }
    .touch-btn-dir .touch-arrow {
      font-size: 26px;
      line-height: 1;
    }
    .touch-btn-dir .touch-label {
      font-size: 9px;
      letter-spacing: 0.5px;
      margin-top: 2px;
      color: #388E3C;
    }
    .touch-btn-action {
      height: 64px;
      color: #FFFFFF;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    }
    .touch-btn-slide {
      width: 105px;
      background: linear-gradient(135deg, #FFA726, #FB8C00);
      border-color: #FFE082;
    }
    .touch-btn-jump {
      width: 120px;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      border-color: #A5D6A7;
    }
    .touch-btn-action .touch-icon {
      font-size: 23px;
      line-height: 1;
    }
    .touch-btn-action .touch-label {
      font-size: 12px;
      font-weight: 900;
      margin-top: 2px;
    }
    @media (max-width: 680px) {
      .game-title {
        font-size: 16px;
        width: 100%;
        text-align: center;
      }
      .top-bar {
        justify-content: center;
      }
      .touch-btn-dir {
        width: 52px;
        height: 52px;
      }
      .touch-btn-dir .touch-arrow {
        font-size: 20px;
      }
      .touch-btn-dir .touch-label {
        display: none;
      }
      .touch-btn-slide {
        width: 82px;
        height: 52px;
      }
      .touch-btn-jump {
        width: 96px;
        height: 52px;
      }
      .touch-btn-action .touch-icon {
        font-size: 19px;
      }
      .touch-btn-action .touch-label {
        font-size: 10px;
      }
    }
    .music-btn {
      background: #FFFFFF;
      border: 2px solid #4CAF50;
      border-radius: 20px;
      padding: 5px 14px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      color: #2E7D32;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.12);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .music-btn:hover {
      background: #E8F5E9;
      transform: scale(1.04);
    }
    .mission-selector {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .mission-pill {
      background: #FFFFFF;
      border: 2px solid #81C784;
      border-radius: 18px;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      color: #2E7D32;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }
    .mission-pill:hover {
      background: #E8F5E9;
      transform: translateY(-1px);
    }
    .mission-pill.active {
      background: linear-gradient(135deg, #FF6F00, #FFA000);
      border-color: #FF8F00;
      color: white;
      box-shadow: 0 3px 8px rgba(255, 111, 0, 0.35);
    }
    .instructions {
      margin-top: 10px;
      color: #2e5d32;
      font-size: 15px;
      text-align: center;
      max-width: 1000px;
      min-height: 22px;
    }

    /* Modale Fine Missione */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: #FFFFFF;
      border: 4px solid #E91E63;
      border-radius: 20px;
      padding: 30px 40px;
      width: 540px;
      max-width: 90%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-badge {
      display: inline-block;
      background: #FFE082;
      color: #B78103;
      font-weight: bold;
      font-size: 14px;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
      border: 1px solid #FFD54F;
    }
    .modal-card h2 {
      margin: 0 0 10px 0;
      color: #C2185B;
      font-size: 26px;
    }
    .modal-card p {
      color: #455A64;
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 16px 0;
    }
    .modal-score {
      font-size: 22px;
      font-weight: bold;
      color: #2E7D32;
      background: #E8F5E9;
      border: 2px dashed #81C784;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 22px;
    }
    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      flex: 1;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }
    .btn-primary {
      background: #4CAF50;
      color: white;
    }
    .btn-primary:hover {
      background: #43A047;
    }
    .btn-secondary {
      background: #29B6F6;
      color: white;
    }
    .btn-secondary:hover {
      background: #0288D1;
    }
    .btn-quit {
      background: #EF5350;
      color: white;
    }
    .btn-quit:hover {
      background: #E53935;
    }
    .modal-notice {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="top-bar">
      <div class="game-title">🐰 Le Grandi Avventure di Tatà</div>
      <div class="mission-selector">
        <button id="btnM1" class="mission-pill active" onclick="switchMission(1)" tabindex="-1" onfocus="this.blur()">🌻 Missione 1</button>
        <button id="btnM2" class="mission-pill" onclick="switchMission(2)" tabindex="-1" onfocus="this.blur()">🐴 Missione 2</button>
        <button id="btnM3" class="mission-pill" onclick="switchMission(3)" tabindex="-1" onfocus="this.blur()">🍂 Missione 3</button>
        <button id="btnM4" class="mission-pill" onclick="switchMission(4)" tabindex="-1" onfocus="this.blur()">🧗 Missione 4</button>
        <button id="btnM5" class="mission-pill" onclick="switchMission(5)" tabindex="-1" onfocus="this.blur()">🚲 Missione 5: Da Giulia</button>
      </div>
      <div class="top-bar-controls">
        <button id="musicBtn" class="music-btn" onclick="toggleMusic()" tabindex="-1" onfocus="this.blur()">🎵 Musica: ON</button>
        <button id="touchToggleBtn" class="music-btn" onclick="toggleTouchControls()" tabindex="-1" onfocus="this.blur()">📱 Touch: Auto</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="1000" height="562" tabindex="0"></canvas>

    <!-- CONTROLLI TOUCH PER TABLET / MOBILE -->
    <div id="touchControls" class="touch-controls" style="display: none;">
      <!-- Gruppo Direzioni (Mano Sinistra) -->
      <div class="touch-group touch-left">
        <button type="button" class="touch-btn touch-btn-dir" id="btnTouchLeft" data-keys="ArrowLeft,KeyA" tabindex="-1" aria-label="Sinistra">
          <span class="touch-arrow">◀</span>
          <span class="touch-label">INDIETRO</span>
        </button>
        <button type="button" class="touch-btn touch-btn-dir" id="btnTouchDown" data-keys="ArrowDown,KeyS" tabindex="-1" aria-label="Giù o Frena">
          <span class="touch-arrow">▼</span>
          <span class="touch-label">GIÙ</span>
        </button>
        <button type="button" class="touch-btn touch-btn-dir" id="btnTouchRight" data-keys="ArrowRight,KeyD" tabindex="-1" aria-label="Destra">
          <span class="touch-arrow">▶</span>
          <span class="touch-label">AVANTI</span>
        </button>
      </div>

      <!-- Gruppo Azioni (Mano Destra) -->
      <div class="touch-group touch-right">
        <button type="button" class="touch-btn touch-btn-action touch-btn-slide" id="btnTouchSlide" data-keys="ArrowDown,KeyS" tabindex="-1" aria-label="Scivola o Frena">
          <span class="touch-icon" id="iconTouchSlide">💨</span>
          <span class="touch-label" id="labelTouchSlide">SCIVOLA</span>
        </button>
        <button type="button" class="touch-btn touch-btn-action touch-btn-jump" id="btnTouchJump" data-keys="Space,ArrowUp,KeyW" tabindex="-1" aria-label="Salta">
          <span class="touch-icon">🦘</span>
          <span class="touch-label">SALTA</span>
        </button>
      </div>
    </div>

    <div id="instructionsText" class="instructions">
      Caricamento comandi...
    </div>
  </div>

  <!-- MODALE COMPLETAMENTO MISSIONE (DINAMICA PER M1 E M2) -->
  <div id="missionModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-badge" id="modalBadge">🏆 MISSIONE 1 COMPIUTA!</div>
      <h2 id="modalTitle">Tatà è tornato a casa!</h2>
      <p id="modalDesc">Hai attraversato la campagna e il bosco, hai sconfitto il temibile <b>Grande Orso</b> e hai riabbracciato il tuo amico <b>Totò</b> davanti al rifugio!</p>
      <div class="modal-score" id="modalFinalScore">🥕 Punti finali: 0</div>
      <div class="modal-buttons" id="modalButtonsContainer">
        <!-- I pulsanti vengono popolati dinamicamente in showMissionComplete() -->
      </div>
      <div id="modalNotice" class="modal-notice"></div>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const V_WIDTH = 800;
const V_HEIGHT = 450;
const SCALE_25 = 1.25;

function setupHiDPI() {
  canvas.width = Math.round(V_WIDTH * DPR * SCALE_25);
  canvas.height = Math.round(V_HEIGHT * DPR * SCALE_25);
}
setupHiDPI();
window.addEventListener('resize', setupHiDPI);

// Salto interattivo delle cutscene introduttive tramite touch o click
function skipIntroIfActive() {
  if (typeof m2Intro !== 'undefined' && m2Intro && m2Intro.active) {
    m2Intro.active = false;
    tata.x = 145;
    tata.y = 328;
    tata.facing = 1;
    return true;
  }
  if (typeof m3Intro !== 'undefined' && m3Intro && m3Intro.active) {
    m3Intro.active = false;
    tata.x = 180;
    tata.y = 336;
    tata.facing = 1;
    return true;
  }
  if (typeof m4Intro !== 'undefined' && m4Intro && m4Intro.active) {
    m4Intro.active = false;
    tata.x = 170;
    tata.y = 336;
    tata.facing = 1;
    return true;
  }
  if (typeof m5Intro !== 'undefined' && m5Intro && m5Intro.active) {
    m5Intro.active = false;
    tata.x = 80;
    tata.y = 310;
    tata.facing = 1;
    tata.vx = 3.8;
    return true;
  }
  return false;
}

// --- STATO TASTI & AVVIO AUDIO ---
const keys = {};
window.addEventListener('keydown', e => { 
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) || e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
  }
  keys[e.code] = true; 
  ensureAudioStarted();
});
window.addEventListener('keyup', e => { 
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) || e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
  }
  keys[e.code] = false; 
});

canvas.addEventListener('click', () => {
  canvas.focus();
  ensureAudioStarted();
  skipIntroIfActive();
});
canvas.addEventListener('touchstart', e => {
  ensureAudioStarted();
  skipIntroIfActive();
}, { passive: true });

// ==========================================
// CONTROLLI TOUCH PER TABLET / MOBILE
// ==========================================
let touchControlsVisible = false;

function toggleTouchControls(force) {
  const container = document.getElementById('touchControls');
  const btn = document.getElementById('touchToggleBtn');
  if (!container || !btn) return;

  if (typeof force === 'boolean') {
    touchControlsVisible = force;
  } else {
    touchControlsVisible = !touchControlsVisible;
  }

  container.style.display = touchControlsVisible ? 'flex' : 'none';
  btn.innerHTML = touchControlsVisible ? '📱 Touch: ON' : '📱 Touch: OFF';
  btn.style.background = touchControlsVisible ? '#E8F5E9' : '#FFFFFF';
  btn.style.borderColor = touchControlsVisible ? '#4CAF50' : '#B0BEC5';
  btn.style.color = touchControlsVisible ? '#2E7D32' : '#78909C';
}

function initTouchControls() {
  const touchButtons = document.querySelectorAll('.touch-btn');

  function pressKey(btn) {
    ensureAudioStarted();
    skipIntroIfActive();
    btn.classList.add('touch-active');
    const keyList = (btn.dataset.keys || '').split(',');
    keyList.forEach(k => {
      if (k) keys[k] = true;
    });
  }

  function releaseKey(btn) {
    btn.classList.remove('touch-active');
    const keyList = (btn.dataset.keys || '').split(',');
    keyList.forEach(k => {
      if (k) keys[k] = false;
    });
  }

  touchButtons.forEach(btn => {
    // Touch Events (Multi-Touch reale)
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      pressKey(btn);
    }, { passive: false });

    btn.addEventListener('touchend', e => {
      e.preventDefault();
      releaseKey(btn);
    }, { passive: false });

    btn.addEventListener('touchcancel', e => {
      e.preventDefault();
      releaseKey(btn);
    }, { passive: false });

    // Mouse Events per test desktop
    btn.addEventListener('mousedown', e => {
      e.preventDefault();
      pressKey(btn);
    });
    btn.addEventListener('mouseup', e => {
      e.preventDefault();
      releaseKey(btn);
    });
    btn.addEventListener('mouseleave', () => {
      releaseKey(btn);
    });
  });

  // Sicurezza globale: reset su perdita finestra o rilascio
  window.addEventListener('blur', () => {
    touchButtons.forEach(btn => releaseKey(btn));
  });

  // Rilevamento automatico touchscreen (tablet / iPad / smartphone)
  const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  toggleTouchControls(isTouch);
}

// Inizializza i controlli touch non appena il DOM è pronto
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initTouchControls);
} else {
  initTouchControls();
}

// ==========================================
// SISTEMA AUDIO (WEB AUDIO API)
// ==========================================
let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;
let isMusicMuted = false;
let musicStarted = false;
let nextNoteTime = 0;
let currentStep = 0;
let scheduleTimer = null;

const NOTE_FREQS = {
  C2: 65.41, D2: 73.42, E2: 82.41, F2: 87.31, G2: 98.00, A2: 110.00, B2: 123.47,
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
  C6: 1046.50, D6: 1174.66, E6: 1318.51,
  R: 0
};

// Melodia spensierata e saltellante a 32 step (ottavi a 140 BPM)
const MELODY_STEPS = [
  // Frase 1: tema saltellante
  'E5', 'R', 'G5', 'A5', 'G5', 'E5', 'C5', 'D5',
  'E5', 'F5', 'G5', 'E5', 'D5', 'R', 'G4', 'B4',
  // Frase 2: salita giocosa
  'C5', 'E5', 'G5', 'C6', 'B5', 'A5', 'G5', 'E5',
  'F5', 'D5', 'B4', 'G4', 'C5', 'R', 'E5', 'R',
  // Frase 3: variazione allegra
  'A5', 'R', 'C6', 'A5', 'G5', 'E5', 'C5', 'E5',
  'F5', 'A5', 'F5', 'D5', 'G5', 'R', 'G5', 'R',
  // Frase 4: chiusura cartoon
  'E5', 'G5', 'C6', 'B5', 'A5', 'G5', 'F5', 'D5',
  'C5', 'R', 'E5', 'D5', 'C5', 'R', 'C5', 'R'
];

// Basso "oom-pah" saltellante a 32 step
const BASS_STEPS = [
  'C3', 'G3', 'C3', 'G3', 'C3', 'E3', 'G3', 'C3',
  'G2', 'D3', 'G2', 'D3', 'G2', 'B2', 'D3', 'G3',
  'C3', 'G3', 'E3', 'G3', 'F3', 'C4', 'C3', 'G3',
  'G2', 'D3', 'G2', 'B2', 'C3', 'G3', 'C3', 'G3',

  'F3', 'C4', 'F3', 'C4', 'C3', 'G3', 'C3', 'G3',
  'D3', 'A3', 'D3', 'A3', 'G2', 'D3', 'G2', 'B2',
  'C3', 'G3', 'E3', 'G3', 'F3', 'C4', 'G2', 'D3',
  'C3', 'G3', 'G2', 'B2', 'C3', 'R', 'C3', 'R'
];

function initAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContextClass();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.22; // Volume master morbido
    masterGain.connect(audioCtx.destination);

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.7;
    musicGain.connect(masterGain);

    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 1.0;
    sfxGain.connect(masterGain);

    startMusicLoop();
  } else if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function ensureAudioStarted() {
  if (!musicStarted) {
    musicStarted = true;
    initAudio();
  } else if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// Nota di melodia/basso con inviluppo dolce stile marimba cartoon
function playSynthNote(freq, time, duration, type, vol) {
  if (!audioCtx || freq <= 0) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);

  gain.gain.setValueAtTime(0.0001, time);
  gain.gain.exponentialRampToValueAtTime(vol, time + 0.02);
  gain.gain.exponentialRampToValueAtTime(vol * 0.35, time + duration * 0.6);
  gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

  osc.connect(gain);
  gain.connect(musicGain);

  osc.start(time);
  osc.stop(time + duration + 0.05);
}

// Percussione giocosa (woodblock cartoon)
function playPercussion(time, isBeat) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  const startFreq = isBeat ? 320 : 540;
  const endFreq = isBeat ? 110 : 220;
  osc.frequency.setValueAtTime(startFreq, time);
  osc.frequency.exponentialRampToValueAtTime(endFreq, time + 0.045);

  gain.gain.setValueAtTime(isBeat ? 0.18 : 0.09, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);

  osc.connect(gain);
  gain.connect(musicGain);

  osc.start(time);
  osc.stop(time + 0.05);
}

// Scheduler a lookahead per timing musicale perfetto
function scheduler() {
  const stepDuration = 60 / 140 / 2; // ~0.214s per ottavo a 140 BPM
  while (nextNoteTime < audioCtx.currentTime + 0.15) {
    // 1. Melodia
    const melNote = MELODY_STEPS[currentStep % MELODY_STEPS.length];
    const melFreq = NOTE_FREQS[melNote] || 0;
    if (melFreq > 0) {
      playSynthNote(melFreq, nextNoteTime, stepDuration * 0.85, 'triangle', 0.28);
    }

    // 2. Basso
    const bassNote = BASS_STEPS[currentStep % BASS_STEPS.length];
    const bassFreq = NOTE_FREQS[bassNote] || 0;
    if (bassFreq > 0) {
      playSynthNote(bassFreq, nextNoteTime, stepDuration * 0.75, 'sine', 0.35);
    }

    // 3. Ritmo
    playPercussion(nextNoteTime, currentStep % 2 === 0);

    nextNoteTime += stepDuration;
    currentStep++;
  }
}

function startMusicLoop() {
  nextNoteTime = audioCtx.currentTime + 0.05;
  if (!scheduleTimer) {
    scheduleTimer = setInterval(scheduler, 40);
  }
}

}

function drawTata(x, y, facing) {
  ctx.save();
  ctx.translate(x + tata.w / 2, y + tata.h / 2);
  ctx.scale(facing, 1);

  // Effetto lampeggio se ha subito danno recentemente
  if (tata.hurtTimer > 0 && Math.floor(tata.hurtTimer / 4) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  // Palette Dudù (rosa pastello soffice, peluche e filo da ricamo)
  const plushPink = "#F8A4B8";       // Rosa principale del peluche
  const plushLightPink = "#FFE6ED";  // Rosa chiaro per interno orecchie e dettagli
  const stitchColor = "#D4708A";     // Colore per le cuciture a vista
  const threadDark = "#4A2828";      // Filo scuro ricamato per occhi e bocca

  // 1. Orecchie morbide lunghe da dudù
  // Orecchio sinistro/posteriore (leggermente piegato all'indietro)
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(-7, -23, 6, 16, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.ellipse(-7, -23, 3, 11, -0.15, 0, Math.PI * 2);
  ctx.fill();

  // Orecchio destro/anteriore
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(5, -24, 6, 16, 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.ellipse(5, -24, 3, 11, 0.12, 0, Math.PI * 2);
  ctx.fill();

  // Cuciture decorative a tratteggio sull'orecchio
  ctx.save();
  ctx.strokeStyle = stitchColor;
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 2]);
  ctx.beginPath();
  ctx.ellipse(5, -24, 5.5, 14, 0.12, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // 2. Corpicino a "copertina / fazzoletto" tipico del Dudù
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.moveTo(-5, 6);
  // Drappeggio della copertina verso il basso
  ctx.quadraticCurveTo(-14, 12, -15, 20);
  // Bordo inferiore con ondina morbida
  ctx.quadraticCurveTo(-5, 17, 0, 20);
  ctx.quadraticCurveTo(8, 17, 14, 20);
  // Risalita verso il collo
  ctx.quadraticCurveTo(11, 10, 5, 6);
  ctx.closePath();
  ctx.fill();

  // Nodini tipici agli angoli del fazzoletto dudù
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(-15, 20, 3, 0, Math.PI * 2); // nodino posteriore
  ctx.arc(14, 20, 3, 0, Math.PI * 2);  // nodino anteriore
  ctx.fill();

  // Cuciture a vista sul bordo della copertina
  ctx.save();
  ctx.strokeStyle = stitchColor;
  ctx.lineWidth = 1.2;
  ctx.setLineDash([2.5, 2]);
  ctx.beginPath();
  ctx.moveTo(-13, 18);
  ctx.quadraticCurveTo(-4, 15, 0, 18);
  ctx.quadraticCurveTo(6, 15, 12, 18);
  ctx.stroke();
  ctx.restore();

  // Cuoricino / toppa ricamata sul pancino del dudù
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(-1, 12, 2.5, 0, Math.PI * 2);
  ctx.arc(3, 12, 2.5, 0, Math.PI * 2);
  ctx.lineTo(1, 16);
  ctx.closePath();
  ctx.fill();

  // 3. Codina soffice a pon-pon
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(-13, 10, 5.5, 0, Math.PI * 2);
  ctx.fill();

  // 4. Testolina rotonda morbida
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.arc(0, -2, 14, 0, Math.PI * 2);
  ctx.fill();

  // Guancia morbida rosata
  ctx.fillStyle = "#FF7C9C";
  ctx.beginPath();
  ctx.arc(4, 3, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Occhietto ricamato (stile punto da cucito/bottone morbido)
  ctx.fillStyle = threadDark;
  ctx.beginPath();
  ctx.arc(5, -4, 2.3, 0, Math.PI * 2);
  ctx.fill();
  // Doppio punto luce bianco (sparkle lucente dudù)
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(5.8, -4.8, 0.9, 0, Math.PI * 2);
  ctx.arc(4.2, -3.2, 0.45, 0, Math.PI * 2);
  ctx.fill();

  // Nasino ricamato a cuore/triangolino
  ctx.fillStyle = "#E75480";
  ctx.beginPath();
  ctx.moveTo(11, -3);
  ctx.lineTo(13.5, -5);
  ctx.lineTo(13.5, -1);
  ctx.closePath();
  ctx.fill();

  // Boccuccia ricamata (linea sottile stile filo cucito)
  ctx.strokeStyle = threadDark;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(10, 0, 2.5, 0.2, Math.PI * 0.75);
  ctx.stroke();

  // Fiocchetto soffice sotto il collo
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(2, 6, 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Disegna l'asinella Mulan da sola (utilizzata nell'intro della stalla)
function drawMulanOnly(x, y, facing, trotPhase = 0, isSliding = false) {
  ctx.save();
  ctx.translate(x + 28, y + 26);
  ctx.scale(facing, 1);

  const coatColor = "#C4BBB4";       // Grigio tortora morbido
  const snoutColor = "#FFF8F2";      // Musetto crema latte
  const innerEarColor = "#FFCDD2";   // Rosa tenue interno orecchie
  const maneColor = "#4E342E";       // Criniera e zoccoli marrone scuro
  const eyeColor = "#263238";

  // 1. Zampe posteriori e anteriori
  const legOffset1 = isSliding ? 8 : Math.sin(trotPhase) * 6;
  const legOffset2 = isSliding ? 10 : -Math.sin(trotPhase) * 6;

  // Zampa posteriore sinistra
  ctx.fillStyle = "#A89F98";
  ctx.fillRect(-15 + legOffset1, 10, 6, 15);
  ctx.fillStyle = maneColor;
  ctx.fillRect(-15 + legOffset1, 23, 6, 4);

  // Zampa anteriore sinistra
  ctx.fillStyle = "#A89F98";
  ctx.fillRect(8 + legOffset2, 10, 6, 15);
  ctx.fillStyle = maneColor;
  ctx.fillRect(8 + legOffset2, 23, 6, 4);

  // 2. Codina con ciuffo
  ctx.strokeStyle = coatColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-18, 5);
  const tailSway = Math.sin(Date.now() * 0.008) * 4;
  ctx.quadraticCurveTo(-26, 8 + tailSway, -28, 14 + tailSway);
  ctx.stroke();
  // Nappa scura all'estremità della coda
  ctx.fillStyle = maneColor;
  ctx.beginPath();
  ctx.ellipse(-28, 15 + tailSway, 4, 6, 0.4, 0, Math.PI * 2);
  ctx.fill();

  // 3. Corpo morbido da asinella
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.ellipse(-3, 6, 18, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pancino chiaro
  ctx.fillStyle = "#ECE5DE";
  ctx.beginPath();
  ctx.ellipse(-2, 10, 12, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  // 4. Zampe anteriori in primo piano
  ctx.fillStyle = coatColor;
  ctx.fillRect(-11 - legOffset1, 12, 6, 14);
  ctx.fillStyle = maneColor;
  ctx.fillRect(-11 - legOffset1, 24, 6, 4);

  ctx.fillStyle = coatColor;
  ctx.fillRect(12 - legOffset2, 12, 6, 14);
  ctx.fillStyle = maneColor;
  ctx.fillRect(12 - legOffset2, 24, 6, 4);

  // 5. Collo e Criniera
  ctx.fillStyle = maneColor;
  ctx.beginPath();
  ctx.moveTo(3, -2);
  ctx.lineTo(1, -16);
  ctx.lineTo(8, -14);
  ctx.lineTo(10, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.moveTo(4, 4);
  ctx.lineTo(12, -12);
  ctx.lineTo(18, -10);
  ctx.lineTo(15, 6);
  ctx.closePath();
  ctx.fill();

  // 6. Testolina e musetto
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.arc(15, -12, 9, 0, Math.PI * 2);
  ctx.fill();

  // Muso allungato e tenero
  ctx.fillStyle = snoutColor;
  ctx.beginPath();
  ctx.ellipse(22, -10, 7, 6, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Narice e boccuccia
  ctx.fillStyle = "#E57373";
  ctx.beginPath();
  ctx.arc(26, -11, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = maneColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(23, -8, 2.5, 0.1, Math.PI * 0.75);
  ctx.stroke();

  // Guancia rosa da dudù
  ctx.fillStyle = "#FF8DA1";
  ctx.beginPath();
  ctx.arc(16, -7, 2.8, 0, Math.PI * 2);
  ctx.fill();

  // Occhio grande, dolce e femminile con lunghe ciglia
  ctx.fillStyle = eyeColor;
  ctx.beginPath();
  ctx.arc(14, -13, 2.6, 0, Math.PI * 2);
  ctx.fill();
  // Doppio punto luce speculare
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(15, -14, 1.0, 0, Math.PI * 2);
  ctx.arc(13.2, -12.2, 0.45, 0, Math.PI * 2);
  ctx.fill();
  // 3 ciglia graziose
  ctx.strokeStyle = maneColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(13, -15); ctx.lineTo(11, -18);
  ctx.moveTo(15, -15); ctx.lineTo(14, -19);
  ctx.moveTo(17, -14); ctx.lineTo(18, -18);
  ctx.stroke();

  // 7. Grandi orecchie da asinella
  // Orecchio posteriore
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.ellipse(9, -24, 4, 11, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = innerEarColor;
  ctx.beginPath();
  ctx.ellipse(9, -24, 2, 8, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Orecchio anteriore
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.ellipse(14, -25, 4.5, 12, 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = innerEarColor;
  ctx.beginPath();
  ctx.ellipse(14, -25, 2.2, 9, 0.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// Disegna la coppia inseparabile: Tatà che cavalca Mulan l'asinella!
function drawMulanWithTata(x, y, facing) {
  ctx.save();
  ctx.translate(x + tata.w / 2, y + tata.h / 2);
  ctx.scale(facing, 1);

  // Lampeggio invulnerabilità dopo un colpo subito
  if (tata.hurtTimer > 0 && Math.floor(tata.hurtTimer / 4) % 2 === 0) {
    ctx.globalAlpha = 0.35;
  }

  // Angolo trotto per le zampe di Mulan
  const isMoving = Math.abs(tata.vx) > 0.2;
  const trotPhase = (isMoving && tata.grounded) ? Date.now() * 0.016 : 0;
  const isSlide = isSliding || (!tata.grounded && tata.vy > 3);

  // Se è in scivolata, leggera inclinazione in avanti
  if (isSliding) {
    ctx.rotate(0.08);
  }

  const coatColor = "#C4BBB4";       // Grigio tortora morbido peluche
  const snoutColor = "#FFF8F2";      // Musetto chiaro crema
  const innerEarColor = "#FFCDD2";   // Rosa interno orecchie
  const maneColor = "#4E342E";       // Criniera e zoccoli marrone scuro
  const eyeColor = "#263238";

  // --- 1. ZAMPE POSTERIORI E ANTERIORI DI MULAN ---
  let legBackRot = isSlide ? 0.35 : Math.sin(trotPhase) * 0.45;
  let legFrontRot = isSlide ? 0.45 : -Math.sin(trotPhase) * 0.45;
  if (!tata.grounded) {
    legBackRot = 0.2;
    legFrontRot = -0.25;
  }

  // Zampa posteriore sinistra
  ctx.save();
  ctx.translate(-14, 12);
  ctx.rotate(legBackRot);
  ctx.fillStyle = "#A89F98";
  ctx.fillRect(-3, 0, 6, 15);
  ctx.fillStyle = maneColor;
  ctx.fillRect(-3, 12, 6, 4);
  ctx.restore();

  // Zampa anteriore sinistra
  ctx.save();
  ctx.translate(10, 12);
  ctx.rotate(legFrontRot);
  ctx.fillStyle = "#A89F98";
  ctx.fillRect(-3, 0, 6, 15);
  ctx.fillStyle = maneColor;
  ctx.fillRect(-3, 12, 6, 4);
  ctx.restore();

  // --- 2. CODINA CHE SCUOTE CON NAPPINA ---
  ctx.strokeStyle = coatColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-18, 6);
  const tailSway = isMoving ? Math.sin(Date.now() * 0.015) * 5 : 0;
  ctx.quadraticCurveTo(-26, 10 + tailSway, -28, 16 + tailSway);
  ctx.stroke();
  ctx.fillStyle = maneColor;
  ctx.beginPath();
  ctx.ellipse(-28, 17 + tailSway, 4.2, 6.5, 0.4, 0, Math.PI * 2);
  ctx.fill();

  // --- 3. CORPO DI MULAN ---
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.ellipse(-2, 7, 20, 13, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pancino chiaro
  ctx.fillStyle = "#ECE5DE";
  ctx.beginPath();
  ctx.ellipse(-1, 11, 13, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // --- 4. SELLA / GUALDRAPPA COLORATA ---
  // Copertina lilla pastello con frange oro e cuore
  ctx.fillStyle = "#B39DDB";
  ctx.beginPath();
  ctx.roundRect(-12, -1, 18, 12, 4);
  ctx.fill();
  ctx.fillStyle = "#FFD54F"; // Frangia dorata
  ctx.fillRect(-12, 9, 18, 2.5);
  // Toppa a cuoricino sulla sella
  ctx.fillStyle = "#E91E63";
  ctx.beginPath();
  ctx.arc(-5, 4, 2, 0, Math.PI * 2);
  ctx.arc(-2, 4, 2, 0, Math.PI * 2);
  ctx.lineTo(-3.5, 7.5);
  ctx.closePath();
  ctx.fill();

  // --- 5. TATÀ SEDUTO IN GROPPA! ---
  // Corpicino dudù rosa di Tatà
  const plushPink = "#F8A4B8";
  const plushLightPink = "#FFE6ED";
  const stitchColor = "#D4708A";
  const threadDark = "#4A2828";

  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(-3, -7, 8.5, 8, -0.1, 0, Math.PI * 2);
  ctx.fill();

  // Toppa a cuore sul petto di Tatà
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.arc(-4, -6, 1.8, 0, Math.PI * 2);
  ctx.arc(-1.5, -6, 1.8, 0, Math.PI * 2);
  ctx.lineTo(-2.8, -3);
  ctx.closePath();
  ctx.fill();

  // Zampine di Tatà che tengono le briglie / criniera
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(3, -4, 4, 2.5, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Testolina di Tatà
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.arc(-2, -17, 9.5, 0, Math.PI * 2);
  ctx.fill();

  // Guancia rosa di Tatà
  ctx.fillStyle = "#FF7C9C";
  ctx.beginPath();
  ctx.arc(2, -14, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Occhietto ricamato sorridente di Tatà
  ctx.fillStyle = threadDark;
  ctx.beginPath();
  ctx.arc(2, -18, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(2.8, -18.8, 0.7, 0, Math.PI * 2);
  ctx.fill();

  // Nasino Tatà
  ctx.fillStyle = "#E75480";
  ctx.beginPath();
  ctx.moveTo(5, -16.5);
  ctx.lineTo(6.5, -18);
  ctx.lineTo(6.5, -15);
  ctx.closePath();
  ctx.fill();

  // Orecchie lunghe rosa di Tatà al vento
  const windTilt = isMoving ? -0.28 : -0.1;
  // Orecchio sinistro
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(-7, -30, 4, 11, windTilt - 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.ellipse(-7, -30, 2, 7, windTilt - 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Orecchio destro
  ctx.fillStyle = plushPink;
  ctx.beginPath();
  ctx.ellipse(0, -32, 4.2, 12, windTilt + 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = plushLightPink;
  ctx.beginPath();
  ctx.ellipse(0, -32, 2.2, 8, windTilt + 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Cuciture su Tatà
  ctx.save();
  ctx.strokeStyle = stitchColor;
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 2]);
  ctx.beginPath();
  ctx.arc(-2, -17, 9, 1.2, 2.8);
  ctx.stroke();
  ctx.restore();

  // --- 6. ZAMPE ANTERIORI IN PRIMO PIANO DI MULAN ---
  // Zampa posteriore destra
  ctx.save();
  ctx.translate(-9, 13);
  ctx.rotate(-legBackRot);
  ctx.fillStyle = coatColor;
  ctx.fillRect(-3, 0, 6, 15);
  ctx.fillStyle = maneColor;
  ctx.fillRect(-3, 12, 6, 4);
  ctx.restore();

  // Zampa anteriore destra
  ctx.save();
  ctx.translate(15, 13);
  ctx.rotate(-legFrontRot);
  ctx.fillStyle = coatColor;
  ctx.fillRect(-3, 0, 6, 15);
  ctx.fillStyle = maneColor;
  ctx.fillRect(-3, 12, 6, 4);
  ctx.restore();

  // --- 7. COLLO, CRINIERA E TESTA DI MULAN ---
  ctx.fillStyle = maneColor;
  ctx.beginPath();
  ctx.moveTo(5, -1);
  ctx.lineTo(4, -17);
  ctx.lineTo(11, -15);
  ctx.lineTo(13, 0);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.moveTo(5, 5);
  ctx.lineTo(14, -13);
  ctx.lineTo(21, -11);
  ctx.lineTo(17, 7);
  ctx.closePath();
  ctx.fill();

  // Testolina di Mulan
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.arc(17, -13, 10, 0, Math.PI * 2);
  ctx.fill();

  // Musetto crema morbido
  ctx.fillStyle = snoutColor;
  ctx.beginPath();
  ctx.ellipse(25, -11, 8, 6.5, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Narice e boccuccia
  ctx.fillStyle = "#E57373";
  ctx.beginPath();
  ctx.arc(29, -12, 1.3, 0, Math.PI * 2);
  ctx.fill();

  // Sorriso di Mulan (felice di correre!)
  ctx.strokeStyle = maneColor;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(26, -9, 3, 0.1, Math.PI * 0.8);
  ctx.stroke();

  // Guancia dolce di Mulan
  ctx.fillStyle = "#FF8DA1";
  ctx.beginPath();
  ctx.arc(18, -8, 3.2, 0, Math.PI * 2);
  ctx.fill();

  // Occhio grande lucido con ciglia
  ctx.fillStyle = eyeColor;
  ctx.beginPath();
  ctx.arc(16, -14, 2.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(17, -15, 1, 0, Math.PI * 2);
  ctx.fill();

  // Ciglia
  ctx.strokeStyle = maneColor;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(14, -16); ctx.lineTo(12, -19);
  ctx.moveTo(16, -16.5); ctx.lineTo(15, -20);
  ctx.moveTo(18, -15.5); ctx.lineTo(19, -19);
  ctx.stroke();

  // --- 8. ORECCHIE LUNGHE DI MULAN ---
  // Orecchio posteriore
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.ellipse(11, -26, 4.5, 12, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = innerEarColor;
  ctx.beginPath();
  ctx.ellipse(11, -26, 2.2, 9, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Orecchio anteriore
  ctx.fillStyle = coatColor;
  ctx.beginPath();
  ctx.ellipse(17, -27, 4.8, 13, 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = innerEarColor;
  ctx.beginPath();
  ctx.ellipse(17, -27, 2.5, 10, 0.08, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawCheese(ch) {
  const x = ch.x;
  const y = ch.y;

  // Triangolo giallo/arancione (fetta di formaggio)
  ctx.fillStyle = "#FFA000";
  ctx.beginPath();
  ctx.moveTo(x, y + ch.h);
  ctx.lineTo(x + ch.w, y + ch.h);
  ctx.lineTo(x + ch.w, y);
  ctx.closePath();
  ctx.fill();

  // Buchi del formaggio
  ctx.fillStyle = "#FF8F00";
  ctx.beginPath();
  ctx.arc(x + 22, y + 25, 4, 0, Math.PI * 2);
  ctx.arc(x + 12, y + 28, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Occhietti arrabbiati
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(x + 16, y + 15, 2, 0, Math.PI * 2);
  ctx.arc(x + 24, y + 13, 2, 0, Math.PI * 2);
  ctx.fill();

  // Sopracciglia arrabbiate
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 13, y + 12);
  ctx.lineTo(x + 19, y + 15);
  ctx.moveTo(x + 27, y + 11);
  ctx.lineTo(x + 21, y + 14);
  ctx.stroke();
}

function drawHedgehog(en) {
  const dir = en.vx >= 0 ? 1 : -1;
  ctx.save();
  ctx.translate(en.x + en.w / 2, en.y + en.h / 2);
  ctx.scale(dir, 1);

  // Dorso con corpo marrone
  ctx.fillStyle = "#4E342E";
  ctx.beginPath();
  ctx.arc(-2, 1, 14, 0.7 * Math.PI, 1.9 * Math.PI);
  ctx.fill();

  // Aculei a zig-zag ben visibili
  ctx.fillStyle = "#2D1810";
  const spikes = [
    [-15, -1], [-13, -7], [-9, -13], [-2, -16], [5, -15], [11, -10], [14, -3]
  ];
  spikes.forEach(([sx, sy]) => {
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - 3, sy - 6);
    ctx.lineTo(sx + 3, sy - 2);
    ctx.closePath();
    ctx.fill();
  });

  // Faccina morbida nocciola
  ctx.fillStyle = "#D7CCC8";
  ctx.beginPath();
  ctx.ellipse(6, 4, 9, 7, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Nasino appuntito nero
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(15, 3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Occhietto
  ctx.beginPath();

function drawBear(en) {
  if (!en.alive && en.squish <= 0) return;
  const dir = en.vx >= 0 ? 1 : -1;
  ctx.save();
  ctx.translate(en.x + en.w / 2, en.y + en.h / 2);
  ctx.scale(dir, 1);

  // Lampeggio di danno subito
  if (en.hitCooldown > 0 && Math.floor(en.hitCooldown / 3) % 2 === 0) {
    ctx.filter = "brightness(2) drop-shadow(0 0 8px red)";
  }

  // Animazione schiacciato se sconfitto
  if (en.squish > 0) {
    ctx.scale(1.35, 0.35);
  }

  // 1. Zampa posteriore
  ctx.fillStyle = "#3E2723";
  ctx.beginPath();
  ctx.ellipse(-18, 22, 11, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // 2. Corpaccione possente
  ctx.fillStyle = "#4E342E";
  ctx.beginPath();
  ctx.ellipse(-4, 4, 26, 20, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Gobba dorsale possente
  ctx.beginPath();
  ctx.arc(-8, -10, 14, 0, Math.PI * 2);
  ctx.fill();

  // Pancione bruno
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.ellipse(0, 8, 16, 13, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // 3. Testa grande
  ctx.fillStyle = "#4E342E";
  ctx.beginPath();
  ctx.arc(16, -4, 15, 0, Math.PI * 2);
  ctx.fill();

  // Orecchie tonde
  ctx.fillStyle = "#3E2723";
  ctx.beginPath();
  ctx.arc(10, -18, 5.5, 0, Math.PI * 2);
  ctx.arc(22, -18, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#8D6E63";
  ctx.beginPath();
  ctx.arc(10, -18, 2.8, 0, Math.PI * 2);
  ctx.arc(22, -18, 2.8, 0, Math.PI * 2);
  ctx.fill();

  // Muso chiaro prominente
  ctx.fillStyle = "#D7CCC8";
  ctx.beginPath();
  ctx.ellipse(24, 0, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tartufone nero
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(29, -1, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Occhi decisi da boss
  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(18, -7, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFF";
  ctx.beginPath();
  ctx.arc(18.5, -7.5, 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Sopracciglia arrabbiate da boss
  ctx.strokeStyle = "#212121";
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(14, -11);
  ctx.lineTo(21, -8);
  ctx.stroke();

  // 4. Zampone anteriori con artigli
  ctx.fillStyle = "#3E2723";
  ctx.beginPath();
  ctx.ellipse(14, 20, 11, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  // Artigli bianchi
  ctx.fillStyle = "#FFF";
  ctx.fillRect(18, 24, 3, 2);
  ctx.fillRect(22, 23, 3, 2);

  ctx.restore();

  // --- BARRA DELLA VITA E CUORICINI DEL BOSS ---
  if (en.alive && en.squish <= 0) {
    ctx.save();
    const midX = en.x + en.w / 2;
    const barY = en.y - 18;

    // Etichetta "GRANDE ORSO"
    ctx.fillStyle = "#D32F2F";
    ctx.font = "bold 12px 'Comic Sans MS', sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.4)";
    ctx.shadowBlur = 3;
    ctx.fillText("🐻 IL GRANDE ORSO", midX, barY - 4);

    // 3 Cuoricini
    for (let i = 0; i < en.maxHp; i++) {
      const hx = midX - 22 + i * 22;
      ctx.font = "16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(i < en.hp ? "❤️" : "🖤", hx, barY + 12);
    }
    ctx.restore();
  }
}

// Il Lupo del Bosco (Boss Finale della Missione 2 a difesa dell'Avena!)
function drawWolf(en) {
  const dir = en.vx >= 0 ? 1 : -1;
  ctx.save();
  ctx.translate(en.x + en.w / 2, en.y + en.h / 2);
  ctx.scale(dir, 1);

  // Effetto lampeggio se ha subito danno recentemente
  if (en.hitCooldown > 0 && Math.floor(en.hitCooldown / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  const wolfGrey = "#546E7A";       // Grigio fumo
  const wolfDark = "#37474F";       // Grigio scuro dettagli
  const wolfLight = "#ECEFF1";      // Pelo crema chiaro petto e muso

  // 1. Folta coda da lupo che scodinzola
  const tailRot = Math.sin(Date.now() * 0.009) * 0.25;
  ctx.save();
  ctx.translate(-24, 2);
  ctx.rotate(tailRot);
  ctx.fillStyle = wolfGrey;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-18, -4, -26, 8);
  ctx.quadraticCurveTo(-22, 16, -10, 10);
  ctx.closePath();
  ctx.fill();
  // Punta chiara della coda
  ctx.fillStyle = wolfLight;
  ctx.beginPath();
  ctx.ellipse(-24, 8, 5, 4, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 2. Zampe posteriori e anteriori
  const step = Math.sin(Date.now() * 0.014) * 6;
  ctx.fillStyle = wolfDark;
  ctx.fillRect(-18 + step, 12, 8, 17);
  ctx.fillRect(8 - step, 12, 8, 17);
  ctx.fillStyle = "#263238"; // Zampette/unghie
  ctx.fillRect(-18 + step, 26, 8, 3.5);
  ctx.fillRect(8 - step, 26, 8, 3.5);

  // 3. Corpo massiccio da lupo
  ctx.fillStyle = wolfGrey;
  ctx.beginPath();
  ctx.ellipse(-4, 4, 25, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // Petto e ventre chiaro
  ctx.fillStyle = wolfLight;
  ctx.beginPath();
  ctx.ellipse(3, 8, 16, 9, 0.15, 0, Math.PI * 2);
  ctx.fill();

  // 4. Zampe in primo piano
  ctx.fillStyle = wolfGrey;
  ctx.fillRect(-12 - step, 14, 8, 16);
  ctx.fillRect(14 + step, 14, 8, 16);
  ctx.fillStyle = "#263238";
  ctx.fillRect(-12 - step, 27, 8, 3.5);
  ctx.fillRect(14 + step, 27, 8, 3.5);

  // 5. Bandana rossa al collo da fiero guardiano
  ctx.fillStyle = "#D32F2F";
  ctx.beginPath();
  ctx.moveTo(8, -4);
  ctx.lineTo(20, -2);
  ctx.lineTo(13, 8);
  ctx.closePath();
  ctx.fill();
  // Pendaglio d'oro
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(13, 9, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // 6. Collo e testa
  ctx.fillStyle = wolfGrey;
  ctx.beginPath();
  ctx.moveTo(4, 2);
  ctx.lineTo(16, -16);
  ctx.lineTo(26, -14);
  ctx.lineTo(22, 6);
  ctx.closePath();
  ctx.fill();

  // Testolina da lupo
  ctx.fillStyle = wolfGrey;
  ctx.beginPath();
  ctx.arc(20, -14, 12, 0, Math.PI * 2);
  ctx.fill();

  // Guancia e sottomuso chiaro
  ctx.fillStyle = wolfLight;
  ctx.beginPath();
  ctx.ellipse(22, -9, 9, 6, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Muso fiero allungato
  ctx.fillStyle = wolfGrey;
  ctx.beginPath();
  ctx.moveTo(18, -19);
  ctx.lineTo(34, -12);
  ctx.lineTo(26, -6);
  ctx.closePath();
  ctx.fill();

  // Nasone nero triangolare
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(33, -12, 3, 0, Math.PI * 2);
  ctx.fill();

  // Dentino da latte cartoon carino
  ctx.fillStyle = "#FFF";
  ctx.beginPath();
  ctx.moveTo(27, -8);
  ctx.lineTo(29, -5);
  ctx.lineTo(30, -8);
  ctx.closePath();
  ctx.fill();

  // Occhio ambrato con mascherina
  ctx.fillStyle = wolfDark;
  ctx.beginPath();
  ctx.ellipse(20, -16, 5, 4, 0.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#FFB300"; // Iride ambrata
  ctx.beginPath();
  ctx.arc(20, -16, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#111"; // Pupilla
  ctx.beginPath();
  ctx.arc(20.5, -16, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFF"; // Luce
  ctx.beginPath();
  ctx.arc(21.2, -17, 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Orecchie a punta attente
  // Orecchio posteriore
  ctx.fillStyle = wolfDark;
  ctx.beginPath();
  ctx.moveTo(11, -22);
  ctx.lineTo(13, -33);
  ctx.lineTo(19, -23);
  ctx.closePath();
  ctx.fill();

  // Orecchio anteriore
  ctx.fillStyle = wolfGrey;
  ctx.beginPath();
  ctx.moveTo(17, -23);
  ctx.lineTo(21, -34);
  ctx.lineTo(27, -22);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = wolfDark;
  ctx.beginPath();
  ctx.moveTo(19, -23);
  ctx.lineTo(21, -31);
  ctx.lineTo(25, -23);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  // 7. BARRA VITA DEL LUPO (4 CUORI) SOPRA LA TESTA
  if (en.alive) {
    ctx.save();
    const midX = en.x + en.w / 2;
    const barY = en.y - 24;

    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.beginPath();
    ctx.roundRect(midX - 60, barY - 14, 120, 30, 8);
    ctx.fill();

    ctx.fillStyle = "#FF7043";
    ctx.font = "bold 12px 'Comic Sans MS', sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 3;
    ctx.fillText("🐺 IL LUPO DEL BOSCO", midX, barY - 2);

    // 4 Cuoricini
    for (let i = 0; i < en.maxHp; i++) {
      const hx = midX - 32 + i * 21;
      ctx.font = "15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(i < en.hp ? "❤️" : "🖤", hx, barY + 13);
    }
    ctx.restore();
  }
}

// Scoiattolo saltellante di peluche (Nemico Faggeta di Lama Bianca)
function drawSquirrel(en) {

  ctx.ellipse(-20 + tailSway, -16, 6, 9, 0.3, 0, Math.PI * 2);

  // Zampette posteriori
  ctx.fillStyle = "#BF360C";
  ctx.fillRect(-8, 10 - hop, 6, 7);
  ctx.fillRect(4, 10 - hop, 6, 7);

  ctx.beginPath();
  ctx.ellipse(3, 4 - hop, 7, 8, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Zampine anteriori che tengono una ghianda
  ctx.fillStyle = "#BF360C";
  ctx.beginPath();
  ctx.ellipse(10, 3 - hop, 3.5, 3, 0, 0, Math.PI * 2);

  ctx.beginPath();
  ctx.arc(13, 0 - hop, 3, Math.PI, 0);
  ctx.fill();

  // Testolina vispa
  ctx.fillStyle = "#E65100";
  ctx.beginPath();
  ctx.arc(8, -8 - hop, 8, 0, Math.PI * 2);
  ctx.fill();

  // Musetto crema
  ctx.fillStyle = "#FFE0B2";
  ctx.beginPath();
  ctx.ellipse(14, -7 - hop, 4.5, 3.5, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.arc(17, -7 - hop, 1.2, 0, Math.PI * 2);

  ctx.beginPath();
  ctx.arc(9, -9 - hop, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFF";
  ctx.beginPath();
  ctx.arc(9.8, -9.8 - hop, 0.8, 0, Math.PI * 2);

  ctx.beginPath();
  ctx.moveTo(3, -13 - hop);
  ctx.lineTo(5, -20 - hop);
  ctx.lineTo(8, -13 - hop);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#BF360C";
  ctx.beginPath();
  ctx.arc(5, -20 - hop, 1.5, 0, Math.PI * 2);

}

  ctx.translate(en.x + en.w / 2, en.y + en.h / 2);
  ctx.scale(dir, 1);

  const bob = Math.sin(Date.now() * 0.015) * 3;

  // Zampette corte ad artiglio
  ctx.fillStyle = "#FFA000";
  ctx.fillRect(-6, 12, 4, 5);
  ctx.fillRect(4, 12, 4, 5);

  // Corpo rotondo piumato ocra
  ctx.fillStyle = "#D97706";
  ctx.beginPath();
  ctx.arc(0, 1 + bob, 14, 0, Math.PI * 2);
  ctx.fill();

  // Piumaggio petto a mezzelune crema
  ctx.fillStyle = "#FEF3C7";
  ctx.beginPath();
  ctx.ellipse(0, 4 + bob, 9, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#B45309";
  ctx.lineWidth = 1;
  for (let r = 0; r < 3; r++) {
    ctx.beginPath();
    ctx.arc(-3 + r * 3, 3 + bob + r * 2.5, 2, 0.2, Math.PI * 0.8);
    ctx.stroke();
  }

  // Ali morbide laterali
  const wingFlap = Math.sin(Date.now() * 0.02) * 0.15;
  ctx.save();
  ctx.translate(-11, bob);
  ctx.rotate(-wingFlap);
  ctx.fillStyle = "#B45309";
  ctx.beginPath();
  ctx.ellipse(0, 2, 4.5, 9, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(11, bob);
  ctx.rotate(wingFlap);
  ctx.fillStyle = "#B45309";
  ctx.beginPath();
  ctx.ellipse(0, 2, 4.5, 9, -0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Occhioni giganti dorati
  // Occhio sinistro
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(-5, -4 + bob, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#F59E0B"; // Iride dorata
  ctx.beginPath();
  ctx.arc(-5, -4 + bob, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1E293B"; // Pupilla
  ctx.beginPath();
  ctx.arc(-4.5, -4 + bob, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(-3.8, -4.8 + bob, 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Occhio destro
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(5, -4 + bob, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#F59E0B";
  ctx.beginPath();
  ctx.arc(5, -4 + bob, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#1E293B";
  ctx.beginPath();
  ctx.arc(5.5, -4 + bob, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(6.2, -4.8 + bob, 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Beccuccio arancione a triangolo
  ctx.fillStyle = "#EA580C";
  ctx.beginPath();
  ctx.moveTo(0, -2 + bob);
  ctx.lineTo(-2.5, 2 + bob);
  ctx.lineTo(2.5, 2 + bob);
  ctx.closePath();
  ctx.fill();

  // Ciuffetti orecchie del gufo
  ctx.fillStyle = "#B45309";
  ctx.beginPath();
  ctx.moveTo(-9, -10 + bob); ctx.lineTo(-12, -18 + bob); ctx.lineTo(-4, -13 + bob); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(9, -10 + bob); ctx.lineTo(12, -18 + bob); ctx.lineTo(4, -13 + bob); ctx.closePath();
  ctx.fill();

  ctx.restore();
}

// La Lontra Gigante dello Stagno (Boss Finale della Missione 3 a Fonte Lama Bianca)
function drawGiantOtter(en) {
  const dir = en.vx >= 0 ? 1 : -1;
  ctx.save();
  ctx.translate(en.x + en.w / 2, en.y + en.h / 2);
  ctx.scale(dir, 1);

  // Effetto lampeggio se ha subito danno recentemente
  if (en.hitCooldown > 0 && Math.floor(en.hitCooldown / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  const otterBrown = "#5D4037";      // Cioccolato morbido
  const otterLight = "#FFF8E7";      // Pelo crema chiaro muso e petto
  const otterDark = "#3E2723";

  // Laghetto / onde d'acqua sotto la lontra
  ctx.fillStyle = "rgba(79, 195, 247, 0.35)";
  ctx.beginPath();
  ctx.ellipse(0, 24, 38, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Bollicine d'acqua che salgono nello stagno
  const tTime = Date.now() * 0.005;
  ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
  for (let b = 0; b < 3; b++) {
    const bx = -20 + b * 20 + Math.sin(tTime + b) * 5;
    const by = 22 - ((tTime * 15 + b * 8) % 18);
    ctx.beginPath();
    ctx.arc(bx, by, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // 1. Coda piatta a timone da lontra che ondeggia
  const tailRot = Math.sin(Date.now() * 0.012) * 0.25;
  ctx.save();
  ctx.translate(-24, 8);
  ctx.rotate(tailRot);
  ctx.fillStyle = otterBrown;
  ctx.beginPath();
  ctx.moveTo(0, -4);
  ctx.quadraticCurveTo(-18, -6, -26, 2);
  ctx.quadraticCurveTo(-20, 10, 0, 6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 2. Zampe posteriori palmate
  ctx.fillStyle = otterDark;
  ctx.fillRect(-15, 12, 9, 14);
  ctx.fillRect(8, 12, 9, 14);
  ctx.fillStyle = "#4FC3F7"; // Goccioline d'acqua sugli zampetti
  ctx.beginPath();
  ctx.arc(-11, 25, 2, 0, Math.PI * 2);
  ctx.arc(12, 25, 2, 0, Math.PI * 2);
  ctx.fill();

  // 3. Corpo massiccio e affusolato da lontra
  ctx.fillStyle = otterBrown;
  ctx.beginPath();
  ctx.ellipse(-2, 4, 26, 17, 0, 0, Math.PI * 2);
  ctx.fill();

  // Pancione crema da dudù
  ctx.fillStyle = otterLight;
  ctx.beginPath();
  ctx.ellipse(3, 7, 17, 11, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // 4. Zampe anteriori in primo piano
  ctx.fillStyle = otterBrown;
  ctx.fillRect(-9, 14, 8, 14);
  ctx.fillRect(15, 14, 8, 14);

  // 5. Testolina tonda e morbida
  ctx.fillStyle = otterBrown;
  ctx.beginPath();
  ctx.arc(18, -10, 13, 0, Math.PI * 2);
  ctx.fill();

  // Guance gonfie e musetto crema
  ctx.fillStyle = otterLight;
  ctx.beginPath();
  ctx.ellipse(22, -6, 11, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Nasone tondo nero lucido da lontra
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(28, -7, 3.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFF";
  ctx.beginPath();
  ctx.arc(29, -8, 1, 0, Math.PI * 2);
  ctx.fill();

  // Lunghi baffetti bianchi da lontra
  ctx.strokeStyle = "#FFFFFF";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(25, -5); ctx.lineTo(35, -7);
  ctx.moveTo(25, -4); ctx.lineTo(36, -3);
  ctx.moveTo(25, -3); ctx.lineTo(34, 1);
  ctx.stroke();

  // Boccuccia sorridente
  ctx.strokeStyle = otterDark;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(24, -3, 3, 0.1, Math.PI * 0.85);
  ctx.stroke();

  // Occhialini da nuoto azzurri lucidi da bagno!
  ctx.fillStyle = "#00BCD4";
  ctx.beginPath();
  ctx.ellipse(17, -13, 5, 4.5, 0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#00838F";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Riflesso lente occhialino
  ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
  ctx.beginPath();
  ctx.ellipse(16, -14, 2, 2.5, 0.3, 0, Math.PI * 2);
  ctx.fill();

  // Cinturino elastico dell'occhialino
  ctx.strokeStyle = "#00BCD4";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(12, -13);
  ctx.quadraticCurveTo(8, -11, 6, -9);
  ctx.stroke();

  // Orecchiette rotonde piccole da lontra
  ctx.fillStyle = otterDark;
  ctx.beginPath();
  ctx.arc(10, -20, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = otterLight;
  ctx.beginPath();
  ctx.arc(10, -20, 1.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // 6. BARRA VITA DELLA LONTRA GIGANTE (4 CUORI)
  if (en.alive) {
    ctx.save();
    const midX = en.x + en.w / 2;
    const barY = en.y - 24;

    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.beginPath();
    ctx.roundRect(midX - 65, barY - 14, 130, 30, 8);
    ctx.fill();

    ctx.fillStyle = "#4FC3F7";
    ctx.font = "bold 12px 'Comic Sans MS', sans-serif";
    ctx.textAlign = "center";
    ctx.shadowColor = "rgba(0,0,0,0.5)";
    ctx.shadowBlur = 3;
    ctx.fillText("🦦 LA LONTRA DELLO STAGNO", midX, barY - 2);

    // 4 Cuoricini
    for (let i = 0; i < en.maxHp; i++) {
      const hx = midX - 32 + i * 21;
      ctx.font = "15px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(i < en.hp ? "❤️" : "🖤", hx, barY + 13);
    }
    ctx.restore();
  }
}

// 11. LA GAZZA LADRA DEL PARCO AVVENTURA (Vola e plana a mezz'aria tra i ponti sospesi)

// 12. IL PICCHIO DEI TRONCHI (Becchetta e pattuglia i pali e i ponti)
function drawWoodpecker(en) {
  ctx.save();
  const facing = en.vx >= 0 ? 1 : -1;
  const midX = en.x + en.w / 2;
  const midY = en.y + en.h / 2;
  const peckMotion = Math.sin(Date.now() * 0.02) * 2;

  ctx.translate(midX, midY);
  ctx.scale(facing, 1);

  // Corpo grigio scuro e ardesia
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.ellipse(0, 3, 9, 7, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Pancino crema
  ctx.fillStyle = "#ECEFF1";
  ctx.beginPath();
  ctx.ellipse(2, 4, 5, 5, 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Coda rigida d'appoggio da picchio
  ctx.fillStyle = "#263238";
  ctx.beginPath();
  ctx.moveTo(-6, 5);
  ctx.lineTo(-14, 14);
  ctx.lineTo(-9, 14);
  ctx.closePath();
  ctx.fill();

  // Testa
  ctx.fillStyle = "#37474F";
  ctx.beginPath();
  ctx.arc(8 + peckMotion, -3, 6.5, 0, Math.PI * 2);
  ctx.fill();

  // Cresta rossa fiammante
  ctx.fillStyle = "#D32F2F";
  ctx.beginPath();
  ctx.moveTo(4 + peckMotion, -6);
  ctx.lineTo(10 + peckMotion, -12);
  ctx.lineTo(12 + peckMotion, -6);
  ctx.closePath();
  ctx.fill();

  // Occhio
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath();
  ctx.arc(9 + peckMotion, -4, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000000";
  ctx.beginPath();
  ctx.arc(9.5 + peckMotion, -4, 1, 0, Math.PI * 2);
  ctx.fill();

  // Becco affilato da picchio
  ctx.fillStyle = "#78909C";
  ctx.beginPath();
  ctx.moveTo(13 + peckMotion, -4);
  ctx.lineTo(21 + peckMotion, -2);
  ctx.lineTo(13 + peckMotion, 0);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawEnemy(en) {
  if (!en.alive && en.squish <= 0) return;
  ctx.save();
  // Animazione schiacciamento se Tatà ci è saltato sopra (esclusi boss orso, lupo, lontra e formaggio_puzzolente)
  if (en.squish > 0 && en.type !== 'orso' && en.type !== 'lupo' && en.type !== 'lontra' && en.type !== 'formaggio_puzzolente') {
    ctx.translate(en.x + en.w / 2, en.y + en.h);
    ctx.scale(1.4, 0.25);
    ctx.translate(-(en.x + en.w / 2), -(en.y + en.h));
    ctx.globalAlpha = Math.max(0.3, en.squish / 15);
  }

  if (en.type === 'formaggio') {
    drawCheese(en);
  } else if (en.type === 'riccio') {
    drawHedgehog(en);
  } else if (en.type === 'puzzola') {
    drawSkunk(en);
  } else if (en.type === 'talpa') {
    drawMole(en);
  } else if (en.type === 'orso') {
    drawBear(en);
  } else if (en.type === 'cinghiale') {
    drawBoar(en);
  } else if (en.type === 'lupo') {
    drawWolf(en);
  } else if (en.type === 'scoiattolo') {
    drawSquirrel(en);
  } else if (en.type === 'gufo') {
    drawOwl(en);
  } else if (en.type === 'lontra') {
    drawGiantOtter(en);
  } else if (en.type === 'gazza') {
    drawMagpie(en);
  } else if (en.type === 'picchio') {
    drawWoodpecker(en);
  } else if (en.type === 'formaggio_puzzolente') {
    drawStinkyCheeseBoss(en);
  }

  ctx.restore();
}

// Collezionabile Missione 3: Castagna d'autunno con guscio mogano lucido e riccio
function drawChestnut(x, y) {
  ctx.save();

  // Riccio parzialmente aperto con aculei
  ctx.fillStyle = "#827717";
  ctx.beginPath();
  ctx.arc(x + 10, y + 16, 11, 0, Math.PI * 2);
  ctx.fill();

  // Spini del riccio
  ctx.fillStyle = "#9E9D24";
  const thornOffsets = [[-10, 0], [-8, -7], [0, -11], [8, -7], [10, 0], [7, 7], [-7, 7]];
  thornOffsets.forEach(([dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(x + 10 + dx, y + 16 + dy);
    ctx.lineTo(x + 10 + dx * 1.3, y + 16 + dy * 1.3);
    ctx.lineTo(x + 10 + dx + 1, y + 16 + dy + 1);
    ctx.closePath();
    ctx.fill();
  });

  // Base rugosa chiara della castagna
  ctx.fillStyle = "#D7CCC8";
  ctx.beginPath();
  ctx.ellipse(x + 10, y + 18, 7.5, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Corpo della castagna marrone mogano
  ctx.fillStyle = "#4E342E";
  ctx.beginPath();
  ctx.moveTo(x + 3, y + 17);
  ctx.quadraticCurveTo(x + 2, y + 8, x + 10, y + 3);
  ctx.quadraticCurveTo(x + 18, y + 8, x + 17, y + 17);
  ctx.closePath();
  ctx.fill();

  // Calda sfumatura dorata/ramata
  ctx.fillStyle = "#6D4C41";
  ctx.beginPath();
  ctx.ellipse(x + 10, y + 11, 5, 6, -0.1, 0, Math.PI * 2);
  ctx.fill();

  // Riflesso lucido tipico della castagna appena caduta
  ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
  ctx.beginPath();
  ctx.ellipse(x + 7.5, y + 8.5, 1.8, 4.5, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Ciuffetto a punta in cima
  ctx.strokeStyle = "#3E2723";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 3);
  ctx.lineTo(x + 10.5, y + 0.5);
  ctx.stroke();

  ctx.restore();
}

// Collezionabile Missione 4: Grappolo di mirtilli della Maiella
function drawBlueberry(x, y) {
  ctx.save();
  ctx.fillStyle = "#4CAF50";
  ctx.beginPath();
  ctx.ellipse(x + 10, y + 3, 4.5, 2.2, -0.3, 0, Math.PI * 2);
  ctx.fill();

  const berries = [
    { bx: x + 6,  by: y + 9,  r: 4.2 },
    { bx: x + 14, by: y + 8,  r: 4.2 },
    { bx: x + 10, by: y + 15, r: 4.5 }
  ];

  berries.forEach(b => {
    const bGrad = ctx.createRadialGradient(b.bx - 1, b.by - 1, 1, b.bx, b.by, b.r);
    bGrad.addColorStop(0, "#5C6BC0");
    bGrad.addColorStop(0.7, "#283593");

    ctx.fillStyle = bGrad;
    ctx.beginPath();
    ctx.arc(b.bx, b.by, b.r, 0, Math.PI * 2);

    ctx.fillStyle = "#1A237E";
    ctx.beginPath();
    ctx.arc(b.bx, b.by - 1, 1.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
    ctx.beginPath();
    ctx.arc(b.bx - 1.2, b.by - 1.5, 1, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.restore();
}

function drawCarrot(x, y) {
  ctx.save();
  // Ciuffetto verde frondoso con 3 foglie sfumate
  ctx.fillStyle = "#43A047";
  ctx.beginPath();
  ctx.ellipse(x + 7, y - 2, 3, 6, -0.35, 0, Math.PI * 2);

  ctx.ellipse(x + 13, y - 2, 3, 6, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#81C784";
  ctx.beginPath();
  ctx.ellipse(x + 10, y - 3, 1.8, 5, 0.08, 0, Math.PI * 2);
  ctx.fill();

  // Corpo carota con gradiente arancio brillante
  const carrotGrad = ctx.createLinearGradient(x + 4, y, x + 16, y + 24);
  carrotGrad.addColorStop(0, "#FF8A65");
  carrotGrad.addColorStop(0.45, "#FF5722");

// Traguardo Missione 2: Il grande Sacco di Avena desiderato da Mulan!
function drawOatSack(x, y) {
  ctx.save();

  // Piccolo piedistallo in legno di faggio
  ctx.fillStyle = "#5D4037";
  ctx.fillRect(x - 10, y + 62, 80, 8);
  ctx.fillStyle = "#795548";
  ctx.fillRect(x - 8, y + 60, 76, 4);

  // Spighe di avena dorate che escono dall'alto
  const time = Date.now() * 0.005;
  const sway = Math.sin(time) * 3;
  ctx.strokeStyle = "#FFC107";
  ctx.lineWidth = 2.5;
  for (let i = 0; i < 5; i++) {
    const sx = x + 12 + i * 9;
    ctx.beginPath();
    ctx.moveTo(sx, y + 8);
    ctx.quadraticCurveTo(sx + (i - 2) * 5 + sway, y - 10, sx + (i - 2) * 8 + sway, y - 22);
    ctx.stroke();

    // Chicchi di avena dorati a grappolo
    ctx.fillStyle = "#FFE082";
    for (let c = 0; c < 3; c++) {
      ctx.beginPath();
      ctx.ellipse(sx + (i - 2) * 6 + sway + (c % 2 === 0 ? 3 : -3), y - 10 - c * 5, 2.5, 4, 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Corpo del sacco in tela di iuta dorata
  ctx.fillStyle = "#D7CCC8";
  ctx.beginPath();
  ctx.moveTo(x + 10, y + 8);
  ctx.quadraticCurveTo(x - 5, y + 35, x + 5, y + 62);
  ctx.lineTo(x + 55, y + 62);
  ctx.quadraticCurveTo(x + 65, y + 35, x + 50, y + 8);
  ctx.closePath();
  ctx.fill();

  // Ombreggiatura sacco
  ctx.fillStyle = "rgba(109, 76, 65, 0.18)";
  ctx.beginPath();
  ctx.moveTo(x + 5, y + 62);
  ctx.quadraticCurveTo(x + 30, y + 54, x + 55, y + 62);
  ctx.lineTo(x + 5, y + 62);
  ctx.fill();

  // Cordino di chiusura con fiocchetto
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(x + 8, y + 12);
  ctx.quadraticCurveTo(x + 30, y + 16, x + 52, y + 12);
  ctx.stroke();

  // Toppa decorativa con spiga ricamata
  ctx.fillStyle = "#FFF9C4";
  ctx.fillRect(x + 14, y + 26, 32, 24);
  ctx.strokeStyle = "#FBC02D";
  ctx.lineWidth = 1.2;
  ctx.strokeRect(x + 14, y + 26, 32, 24);

  // Scritta carina "AVENA"
  ctx.fillStyle = "#E65100";
  ctx.font = "bold 9px 'Comic Sans MS', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("AVENA", x + 30, y + 41);

  // Luccichio festoso fluttuante sopra il sacco
  const sparkle = Math.sin(time * 2);
  ctx.fillStyle = "#FFD700";
  ctx.font = "14px sans-serif";
  ctx.fillText("✨", x + 30 + sparkle * 8, y - 26);
  ctx.fillText("🌾", x + 10 - sparkle * 5, y - 16);

  ctx.restore();
}

// 2. MAESTOSE MONTAGNE INNEVATE LONTANE (Parallasse 0.12)
function drawSnowyMountains(camX) {
  ctx.save();
  ctx.translate(-camX * 0.12, 0);

  const peaks = [
    { x: -100, w: 340, h: 270 },
    { x: 180,  w: 380, h: 320 },
    { x: 500,  w: 300, h: 250 },
    { x: 740,  w: 420, h: 340 },
    { x: 1100, w: 360, h: 280 },
    { x: 1400, w: 400, h: 330 },
    { x: 1750, w: 350, h: 290 },
    { x: 2050, w: 430, h: 350 },
    { x: 2420, w: 380, h: 310 },
    { x: 2750, w: 440, h: 360 },
    { x: 3120, w: 460, h: 370 },
    { x: 3520, w: 480, h: 380 },
    { x: 3950, w: 450, h: 360 },
    { x: 4350, w: 490, h: 390 }
  ];

  peaks.forEach(m => {
    const baseY = 380;
    const peakX = m.x + m.w / 2;
    const peakY = baseY - m.h;

    // Versante sinistro
    ctx.fillStyle = "#78909C";
    ctx.beginPath();
    ctx.moveTo(m.x, baseY);
    ctx.lineTo(peakX, peakY);
    ctx.lineTo(peakX, baseY);
    ctx.closePath();
    ctx.fill();

    // Versante destro in ombra
    ctx.fillStyle = "#546E7A";
    ctx.beginPath();
    ctx.moveTo(peakX, peakY);
    ctx.lineTo(m.x + m.w, baseY);
    ctx.lineTo(peakX, baseY);
    ctx.closePath();
    ctx.fill();

    // Neve candida sulla cima
    const snowH = m.h * 0.38;
    const snowLeftX = peakX - (m.w / 2) * (snowH / m.h);
    const snowRightX = peakX + (m.w / 2) * (snowH / m.h);
    const snowY = peakY + snowH;

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    ctx.moveTo(peakX, peakY);
    ctx.lineTo(snowLeftX, snowY);
    ctx.quadraticCurveTo(peakX - 10, snowY - 14, peakX, snowY + 6);
    ctx.lineTo(peakX, baseY);
    ctx.lineTo(peakX, peakY);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#E0F2F1";
    ctx.beginPath();
    ctx.moveTo(peakX, peakY);
    ctx.lineTo(peakX, baseY);
    ctx.lineTo(peakX, snowY + 6);
    ctx.quadraticCurveTo(peakX + 12, snowY - 10, snowRightX, snowY);
    ctx.closePath();
    ctx.fill();
  });

  ctx.restore();
}

// Recinto di Legno (Fence)
function drawFence(x, y, postsCount = 5) {
  const postDist = 20;
  const h = 26;

  // Assi orizzontali
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(x, y - h + 6, postsCount * postDist, 4);
  ctx.fillRect(x, y - h + 16, postsCount * postDist, 4);

  // Paletti verticali con punta
  for (let i = 0; i <= postsCount; i++) {
    const px = x + i * postDist;
    ctx.fillStyle = "#6D4C41";
    ctx.beginPath();
    ctx.moveTo(px - 3, y);
    ctx.lineTo(px - 3, y - h + 4);
    ctx.lineTo(px, y - h);
    ctx.lineTo(px + 3, y - h + 4);
    ctx.lineTo(px + 3, y);
    ctx.closePath();
    ctx.fill();
  }
}

// Mulino a Vento
function drawWindmill(x, y) {
  const time = Date.now() * 0.0015;

  // Torre in mattoni chiari
  ctx.fillStyle = "#D7CCC8";
  ctx.beginPath();
  ctx.moveTo(x - 22, y);
  ctx.lineTo(x - 14, y - 85);
  ctx.lineTo(x + 14, y - 85);
  ctx.lineTo(x + 22, y);
  ctx.closePath();
  ctx.fill();

  // Tetto cupola
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.arc(x, y - 85, 15, Math.PI, 0);
  ctx.fill();

  // Mozzo centrale pale
  const hubY = y - 85;
  ctx.fillStyle = "#3E2723";
  ctx.beginPath();
  ctx.arc(x, hubY, 5, 0, Math.PI * 2);
  ctx.fill();

  // 4 Pale rotanti
  ctx.save();

  ctx.rotate(time);
  ctx.strokeStyle = "#4E342E";
  ctx.lineWidth = 3;
  ctx.fillStyle = "rgba(255, 255, 255, 0.85)";

    ctx.moveTo(0, 0);
    ctx.lineTo(0, -48);
    ctx.stroke();

// Grande Albero Frondoso del Bosco
function drawDeciduousTree(x, y, hasApples = false) {
  // Tronco
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.moveTo(x - 10, y);
  ctx.quadraticCurveTo(x - 8, y - 45, x - 5, y - 80);
  ctx.lineTo(x + 5, y - 80);
  ctx.quadraticCurveTo(x + 8, y - 45, x + 10, y);
  ctx.closePath();
  ctx.fill();

  // Chioma a nuvole verdeggianti
  const foliage = [
    { ox: 0, oy: -95, r: 35, color: "#2E7D32" },
    { ox: -25, oy: -85, r: 28, color: "#388E3C" },
    { ox: 25, oy: -85, r: 28, color: "#388E3C" },
    { ox: -15, oy: -110, r: 26, color: "#43A047" },
    { ox: 15, oy: -110, r: 26, color: "#43A047" }
  ];
  foliage.forEach(f => {
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(x + f.ox, y + f.oy, f.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Mele (se albero da frutto in campagna)

    [[-18, -80], [14, -90], [-5, -115], [22, -100], [-10, -95]].forEach(([ax, ay]) => {
      ctx.beginPath();
      ctx.arc(x + ax, y + ay, 3.5, 0, Math.PI * 2);

// Abete / Pino (normale o innevato)
function drawPineTree(x, y, snowy = false) {
  // Tronco
  ctx.fillStyle = "#4E342E";
  ctx.fillRect(x - 6, y - 25, 12, 25);

  // Livelli di rami conici
  const tiers = [
    { yOffset: -22, w: 52, h: 32 },
    { yOffset: -45, w: 42, h: 30 },
    { yOffset: -68, w: 30, h: 28 }
  ];

  tiers.forEach(t => {
    ctx.fillStyle = snowy ? "#1B5E20" : "#2E7D32";
    ctx.beginPath();
    ctx.moveTo(x - t.w / 2, y + t.yOffset);
    ctx.lineTo(x, y + t.yOffset - t.h);
    ctx.lineTo(x + t.w / 2, y + t.yOffset);
    ctx.closePath();
    ctx.fill();

    // Cuscinetti di neve sui rami se alpino
    if (snowy) {
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.moveTo(x - t.w / 2, y + t.yOffset);
      ctx.quadraticCurveTo(x - t.w / 4, y + t.yOffset - 6, x, y + t.yOffset - 3);
      ctx.quadraticCurveTo(x + t.w / 4, y + t.yOffset - 6, x + t.w / 2, y + t.yOffset);
      ctx.lineTo(x + t.w / 2 - 4, y + t.yOffset - 3);
      ctx.quadraticCurveTo(x, y + t.yOffset - 8, x - t.w / 2 + 4, y + t.yOffset - 3);
      ctx.closePath();
      ctx.fill();
    }
  });
}

function drawBush(x, y, withBerries = true) {
